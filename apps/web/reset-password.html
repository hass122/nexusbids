<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NexusBids</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%); min-height: 100vh; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-md bg-white/5 backdrop-blur-lg border border-indigo-500/30 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mb-4">
        <i class="fa-solid fa-lock text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">Reset Your Password</h1>
      <p class="text-sm text-gray-400 mt-2">Enter a new password for your account</p>
    </div>

    <div id="error-box" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm"></div>
    <div id="success-box" class="hidden mb-4 p-3 bg-green-500/10 border border-green-500/30 rounded-lg text-green-400 text-sm"></div>

    <form id="reset-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">New Password</label>
        <input type="password" id="password" required minlength="8"
               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500"
               placeholder="At least 8 characters">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Confirm Password</label>
        <input type="password" id="confirm-password" required minlength="8"
               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500"
               placeholder="Type password again">
      </div>
      <button type="submit" id="submit-btn"
              class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg transition-all">
        Reset Password
      </button>
    </form>

    <div class="text-center mt-6">
      <a href="/login.html" class="text-sm text-indigo-400 hover:text-indigo-300">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Login
      </a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('error-box').textContent = 'Invalid reset link. No token found.';
      document.getElementById('error-box').classList.remove('hidden');
      document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorBox = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');
      const btn = document.getElementById('submit-btn');

      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');

      if (password.length < 8) {
        errorBox.textContent = 'Password must be at least 8 characters.';
        errorBox.classList.remove('hidden');
        return;
      }

      if (password !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Resetting...';

      try {
        const res = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });

        const data = await res.json();

        if (res.ok) {
          successBox.textContent = '✅ Password reset successfully! Redirecting to login...';
          successBox.classList.remove('hidden');
          document.getElementById('reset-form').style.display = 'none';
          setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
          errorBox.textContent = data.error || data.message || 'Reset failed. Link may have expired.';
          errorBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = 'Reset Password';
        }
      } catch (err) {
        errorBox.textContent = 'Network error. Please try again.';
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'Reset Password';
      }
    });
  </script>
</body>
</html>
