<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice — NexusBids</title>
    <script>(function () { var t = localStorage.getItem('nexusbids_theme') || 'system'; var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.classList.toggle('dark', d); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); })();</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/design-system.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } };</script>
    <style>
        :root {
            --i-bg: #f4f6fb;
            --i-surface: #fff;
            --i-surface-2: #f7f9fc;
            --i-border: #e3e8f0;
            --i-text: #0f172a;
            --i-text-muted: #58627a;
        }

        html.dark {
            --i-bg: #05070f;
            --i-surface: #0d1220;
            --i-surface-2: #121a2b;
            --i-border: #1e2a40;
            --i-text: #eef2f9;
            --i-text-muted: #9aa6bd;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            background: var(--i-bg);
            color: var(--i-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .invoice-wrap {
            max-width: 800px;
            margin: 32px auto;
            padding: 40px;
            background: var(--i-surface);
            border: 1px solid var(--i-border);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .15);
        }

        .invoice-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid var(--i-border);
        }

        .invoice-title {
            font-size: 2rem;
            font-weight: 800;
            color: #6366f1;
            letter-spacing: -.02em;
        }

        .invoice-meta {
            text-align: right;
            font-size: .8rem;
            color: var(--i-text-muted);
            line-height: 1.6;
        }

        .section-title {
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--i-text-muted);
            margin-bottom: 8px;
        }

        .info-block {
            font-size: .85rem;
            line-height: 1.6;
        }

        .info-block strong {
            display: block;
            font-weight: 700;
            color: var(--i-text);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
            margin: 24px 0;
        }

        .data-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: .7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--i-text-muted);
            border-bottom: 2px solid var(--i-border);
        }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--i-border);
            vertical-align: middle;
        }

        .data-table .amount {
            text-align: right;
            font-weight: 700;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: .88rem;
        }

        .total-row.grand {
            font-size: 1.15rem;
            font-weight: 800;
            padding-top: 16px;
            margin-top: 8px;
            border-top: 2px solid var(--i-border);
            color: #10b981;
        }

        .actions {
            text-align: center;
            margin-top: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 10px;
            font-size: .82rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all .2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
        }

        .btn-ghost {
            background: var(--i-surface-2);
            border: 1px solid var(--i-border);
            color: var(--i-text-muted);
        }

        /* Print Styles - Taake PDF save karte waqt buttons hide ho jayen */
        @media print {

            .actions,
            nav {
                display: none !important;
            }

            .invoice-wrap {
                box-shadow: none;
                border: 1px solid #ccc;
                margin: 0;
                max-width: 100%;
            }

            body {
                background: #fff;
                color: #000;
            }

            html.dark body {
                background: #fff;
                color: #000;
            }

            html.dark .invoice-wrap {
                background: #fff;
                border-color: #ccc;
            }

            html.dark .data-table td,
            html.dark .data-table th {
                color: #000;
                border-color: #ccc;
            }

            html.dark .invoice-title {
                color: #4f46e5;
            }
        }

        @media (max-width:600px) {
            .invoice-wrap {
                padding: 20px;
                margin: 16px;
            }

            .invoice-header {
                flex-direction: column;
                gap: 12px;
            }

            .invoice-meta {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 text-brand-400 font-black text-lg"><i
                class="fa-solid fa-gavel"></i><span>NexusBids</span></a>
        <a id="back-link" href="/seller/orders.html" class="text-sm font-semibold" style="color:var(--i-text-muted);"><i
                class="fa-solid fa-arrow-left mr-1"></i> Back to Orders</a>
    </nav>

    <div class="invoice-wrap" id="invoice-content">
        <div style="text-align:center;padding:60px 20px;color:var(--i-text-muted);">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
            <p>Loading invoice details…</p>
        </div>
    </div>

    <script src="/assets/js/api-client.js"></script>
    <script src="/assets/js/ui.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('order_id') || params.get('id');
            const role = params.get('role') || 'seller'; // Default to seller

            // Helpers
            function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
            function fmtPKR(v) { try { return UI.formatPKR(v); } catch (e) { return 'PKR ' + Number(v || 0).toLocaleString('en-PK'); } }
            function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString('en-PK', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }

            function renderInvoice(o) {

                let gross, fee, net;
                const totalAmt = parseFloat(o.total_amount || 0);
                const sellerAmt = parseFloat(o.seller_amount || 0);
                const commAmt = (o.commission_amount != null) ? parseFloat(o.commission_amount) : null;

                if (commAmt != null && totalAmt > 0) {
                    gross = totalAmt;
                    fee = commAmt;
                    net = gross - fee;
                } else if (totalAmt > 0 && sellerAmt > 0 && sellerAmt < totalAmt) {
                    gross = totalAmt;
                    net = sellerAmt;
                    fee = gross - net;
                } else if (totalAmt > 0) {
                    gross = totalAmt;
                    fee = gross * 0.05;
                    net = gross - fee;
                } else {
                    net = sellerAmt;
                    gross = net > 0 ? net / 0.95 : 0;
                    fee = gross - net;
                }
                const isSeller = role === 'seller';

                document.getElementById('invoice-content').innerHTML = `
          <div class="invoice-header">
            <div>
              <div class="invoice-title">INVOICE</div>
              <div style="font-size:.8rem;color:var(--i-text-muted);margin-top:4px;">NexusBids Marketplace (Pvt) Ltd.</div>
              <div style="font-size:.72rem;color:var(--i-text-muted);">Karachi, Pakistan • GST Registered</div>
            </div>
            <div class="invoice-meta">
              <div><strong>Invoice #:</strong> INV-${esc(o.order_number || o.order_id)}</div>
              <div><strong>Order #:</strong> ${esc(o.order_number || '#' + o.order_id)}</div>
              <div><strong>Date:</strong> ${fmtDate(o.created_at || new Date())}</div>
              <div><strong>Status:</strong> ${esc(o.payment_status || 'paid').toUpperCase()}</div>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;">
            <div>
              <div class="section-title">Billed To (Buyer)</div>
              <div class="info-block">
                <strong>${esc(o.counterparty_name || o.buyer_name || 'Verified Buyer')}</strong>
                ${esc(o.shipping_address || o.delivery_address || 'Address provided at checkout')}<br>
                ${esc(o.city || '')} ${esc(o.postal_code || '')}
              </div>
            </div>
            <div>
              <div class="section-title">Sold By (Seller)</div>
              <div class="info-block">
                <strong>${esc(o.seller_name || 'NexusBids Seller')}</strong>
                Seller Store • Verified<br>
                Pakistan
              </div>
            </div>
          </div>

          <div class="section-title">Line Items</div>
          <table class="data-table">
            <thead><tr><th>Item</th><th>Lot #</th><th class="amount">Amount</th></tr></thead>
            <tbody>
              <tr>
                <td>
                  <strong>${esc(o.auction_title || 'Auction Item')}</strong>
                  <div style="font-size:.72rem;color:var(--i-text-muted);">${esc(o.category_name || 'General')}</div>
                </td>
                <td>#${esc(o.auction_id || '—')}</td>
                <td class="amount">${fmtPKR(gross)}</td>
              </tr>
            </tbody>
          </table>

          <div style="max-width:340px;margin-left:auto;">
            <div class="total-row"><span>Subtotal (Winning Bid)</span><span>${fmtPKR(gross)}</span></div>
            
            ${isSeller ? `
              <div class="total-row"><span>Platform Commission (5%)</span><span>− ${fmtPKR(fee)}</span></div>
              <div class="total-row grand"><span>Seller Net Payout</span><span>${fmtPKR(net)}</span></div>
              <div style="font-size:.7rem;color:var(--i-text-muted);text-align:right;margin-top:8px;">Deposited to seller escrow account</div>
            ` : `
              <div class="total-row grand"><span>Total Paid</span><span>${fmtPKR(gross)}</span></div>
            `}
          </div>

          <div class="actions">
            <button type="button" class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
            <a href="/seller/order-details.html?id=${esc(o.order_id)}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back to Order</a>
          </div>

          <div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--i-border);font-size:.7rem;color:var(--i-text-muted);text-align:center;">
            This is a computer-generated invoice. For queries, contact <strong>support@nexusbids.pk</strong>
          </div>
        `;
            }

            async function loadInvoice() {
                if (!orderId) {
                    document.getElementById('invoice-content').innerHTML = `<div style="text-align:center;padding:60px 20px;color:#f87171;"><i class="fa-solid fa-triangle-exclamation text-2xl mb-3"></i><p>No order ID provided.</p></div>`;
                    return;
                }
                try {
                    const r = await ApiClient.get('/orders/' + orderId);
                    const o = (r && r.data) || r;
                    if (!o || (!o.order_id && !o.id)) throw new Error('Order not found');

                    renderInvoice(o);

                    // Update back link based on role
                    const backLink = document.getElementById('back-link');
                    if (backLink) backLink.href = role === 'seller' ? '/seller/orders.html' : '/buyer/orders.html';

                } catch (err) {
                    document.getElementById('invoice-content').innerHTML = `<div style="text-align:center;padding:60px 20px;color:#f87171;"><i class="fa-solid fa-triangle-exclamation text-2xl mb-3"></i><p>Failed to load invoice: ${esc(err.message)}</p></div>`;
                }
            }

            loadInvoice();
        })();
    </script>
</body>

</html>
