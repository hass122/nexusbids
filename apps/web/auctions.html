<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Explore Live Auctions — NexusBids Pakistan</title>
  <meta name="description"
    content="Discover active auctions across Pakistan with verified sellers, real-time proxy bidding, and bank-grade escrow protection.">

  <script>
    (function () {
      var t = localStorage.getItem('nexusbids_theme') || 'system';
      var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches);
      document.documentElement.classList.toggle('dark', d);
      document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/design-system.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* ============ Tokens ============ */
    :root {
      --ring: 99, 102, 241;
      --bg-page: #f7f8fc;
      --card-bg-l: #ffffff;
      --card-bd-l: #e5e9f0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============ Light-mode overrides ============ */
    html:not(.dark) body {
      background: var(--bg-page) !important;
      color: #0f172a !important;
    }

    html:not(.dark) .bg-slate-950 {
      background: var(--bg-page) !important;
    }

    html:not(.dark) .bg-slate-900,
    html:not(.dark) .bg-slate-900\/70,
    html:not(.dark) .bg-slate-900\/50,
    html:not(.dark) .bg-slate-900\/80 {
      background: var(--card-bg-l) !important;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 12px -4px rgba(15, 23, 42, .06);
    }

    html:not(.dark) .bg-slate-800 {
      background: #f1f5f9 !important;
    }

    html:not(.dark) .bg-slate-100 {
      background: #f7f8fc !important;
    }

    html:not(.dark) .text-slate-100,
    html:not(.dark) .text-slate-200,
    html:not(.dark) .text-white {
      color: #0f172a !important;
    }

    html:not(.dark) .text-slate-300,
    html:not(.dark) .text-slate-400 {
      color: #475569 !important;
    }

    html:not(.dark) .text-slate-500 {
      color: #64748b !important;
    }

    html:not(.dark) .border-slate-800,
    html:not(.dark) .border-slate-800\/80,
    html:not(.dark) .border-slate-700 {
      border-color: var(--card-bd-l) !important;
    }

    html:not(.dark) .bg-slate-950\/80 {
      background: rgba(255, 255, 255, .9) !important;
    }

    /* Inputs */
    input.nb-input,
    select.nb-select {
      display: block;
      width: 100%;
      background-color: var(--input-bg, #fff);
      border: 1px solid var(--input-border, #d8dbe3);
      color: var(--text, #0f172a);
      border-radius: .75rem;
      padding: .6rem .875rem;
      font-size: .8125rem;
      font-weight: 500;
      font-family: inherit;
      line-height: 1.4;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    input.nb-input::placeholder {
      color: #9aa0ae;
    }

    input.nb-input:hover,
    select.nb-select:hover {
      border-color: #b7bcc9;
    }

    input.nb-input:focus,
    select.nb-select:focus {
      border-color: rgb(var(--ring));
      box-shadow: 0 0 0 3px rgba(var(--ring), .15);
    }

    select.nb-select {
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2210%22%20height%3D%226%22%20viewBox%3D%220%200%2010%206%22%3E%3Cpath%20fill%3D%22%239ca3af%22%20d%3D%22M0%200l5%206%205-6z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right .875rem center;
      padding-right: 2.25rem;
    }

    html.dark input.nb-input,
    html.dark select.nb-select {
      background-color: #0f172a;
      border-color: #1e293b;
      color: #e2e8f0;
    }

    html.dark select.nb-select {
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2210%22%20height%3D%226%22%20viewBox%3D%220%200%2010%206%22%3E%3Cpath%20fill%3D%22%236b7280%22%20d%3D%22M0%200l5%206%205-6z%22%2F%3E%3C%2Fsvg%3E");
    }

    /* ============ Card hover ============ */
    .nb-card {
      transition:
        transform .3s cubic-bezier(.16, 1, .3, 1),
        box-shadow .3s cubic-bezier(.16, 1, .3, 1),
        border-color .3s ease;
    }

    .nb-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(99, 102, 241, .22);
      border-color: rgba(99, 102, 241, .55) !important;
    }

    .nb-card:hover .nb-card-img {
      transform: scale(1.05);
    }

    .nb-card-img {
      transition: transform .55s cubic-bezier(.16, 1, .3, 1);
    }

    /* ============================================================
       Heart (watchlist) button — works in light + dark mode
       ============================================================ */
    .nb-heart-btn {
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, .28);
      background: rgba(15, 23, 42, .72);
      color: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition:
        transform .18s ease,
        background-color .2s ease,
        border-color .2s ease,
        color .2s ease,
        box-shadow .2s ease;
      box-shadow: 0 2px 8px -2px rgba(0, 0, 0, .35);
      font-size: .8rem;
      padding: 0;
      line-height: 1;
    }

    .nb-heart-btn i {
      font-size: .8rem;
      pointer-events: none;
    }

    .nb-heart-btn:hover {
      transform: scale(1.08);
    }

    .nb-heart-btn:active {
      transform: scale(.9);
    }

    .nb-heart-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    html:not(.dark) .nb-heart-btn {
      background: rgba(255, 255, 255, .96);
      border-color: rgba(15, 23, 42, .08);
      color: #475569;
      box-shadow:
        0 2px 8px -2px rgba(15, 23, 42, .18),
        0 1px 3px rgba(15, 23, 42, .10);
    }

    html:not(.dark) .nb-heart-btn:hover {
      background: #ffffff;
      color: #e11d48;
      box-shadow:
        0 4px 14px -2px rgba(15, 23, 42, .22),
        0 1px 3px rgba(15, 23, 42, .12);
    }

    html:not(.dark) .nb-heart-btn:focus-visible {
      outline-color: #6366f1;
    }

    .nb-heart-btn.is-watched {
      background: #f43f5e;
      border-color: rgba(244, 63, 94, .5);
      color: #ffffff;
      box-shadow: 0 4px 14px -3px rgba(244, 63, 94, .55);
    }

    .nb-heart-btn.is-watched:hover {
      background: #e11d48;
      border-color: rgba(244, 63, 94, .7);
    }

    html:not(.dark) .nb-heart-btn.is-watched {
      background: #ffe4e6;
      border-color: rgba(244, 63, 94, .35);
      color: #e11d48;
      box-shadow: 0 2px 10px -2px rgba(244, 63, 94, .35);
    }

    html:not(.dark) .nb-heart-btn.is-watched:hover {
      background: #fecdd3;
      color: #be123c;
    }

    /* ============================================================
       Image overlay pills — theme-aware (light + dark)
       ============================================================ */

    /* Countdown badge (top-left on image) */
    .nb-overlay-countdown {
      background: rgba(15, 23, 42, .82);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, .14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }

    html:not(.dark) .nb-overlay-countdown {
      background: rgba(255, 255, 255, .97);
      color: #0f172a;
      border: 1px solid rgba(15, 23, 42, .10);
      box-shadow: 0 2px 8px -2px rgba(15, 23, 42, .20);
      text-shadow: none;
    }

    html:not(.dark) .nb-overlay-countdown i {
      color: #4f46e5 !important;
    }

    /* Bid count badge (top-right on image) */
    .nb-overlay-bidcount {
      background: #4f46e5;
      color: #ffffff;
      border: 1px solid rgba(165, 180, 252, .40);
      box-shadow: 0 2px 10px -2px rgba(79, 70, 229, .55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    html:not(.dark) .nb-overlay-bidcount {
      background: #4f46e5;
      color: #ffffff;
      border: 1px solid rgba(79, 70, 229, .25);
      box-shadow: 0 2px 10px -2px rgba(79, 70, 229, .45);
    }

    /* Category pill (bottom-left on image) */
    .nb-overlay-category {
      background: rgba(15, 23, 42, .85);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, .35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      letter-spacing: .06em;
    }

    html:not(.dark) .nb-overlay-category {
      background: rgba(255, 255, 255, .97);
      color: #4f46e5;
      border: 1px solid rgba(99, 102, 241, .28);
      box-shadow: 0 2px 8px -2px rgba(15, 23, 42, .18);
    }

    /* Urgent countdown — rose in both modes */
    .nb-overlay-countdown.is-urgent {
      background: #f43f5e;
      color: #ffffff;
      border-color: rgba(244, 63, 94, .5);
      box-shadow: 0 4px 14px -3px rgba(244, 63, 94, .55);
    }

    html:not(.dark) .nb-overlay-countdown.is-urgent {
      background: #f43f5e;
      color: #ffffff;
      border-color: rgba(244, 63, 94, .35);
      box-shadow: 0 4px 14px -3px rgba(244, 63, 94, .5);
    }

    html:not(.dark) .nb-overlay-countdown.is-urgent i {
      color: #ffffff !important;
    }

    /* Bid CTA button — crisp text in both modes */
    .nb-bid-btn {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      padding: 0 .875rem;
      height: 2.25rem;
      border-radius: .75rem;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .01em;
      color: #ffffff !important;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      box-shadow: 0 6px 16px -6px rgba(79, 70, 229, .65);
      transition: transform .18s ease, box-shadow .2s ease, background-color .2s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .nb-bid-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px -8px rgba(79, 70, 229, .85);
    }

    .nb-bid-btn:active {
      transform: translateY(0) scale(.96);
    }

    .nb-bid-btn i {
      font-size: .625rem;
    }

    html:not(.dark) .nb-bid-btn {
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      box-shadow: 0 6px 16px -6px rgba(79, 70, 229, .45);
    }

    /* ============ Urgent pulse ============ */
    .nb-urgent {
      animation: nbUrgent 1.2s ease-in-out infinite alternate;
    }

    @keyframes nbUrgent {
      0% {
        opacity: .85;
      }

      100% {
        opacity: 1;
        box-shadow: 0 0 0 3px rgba(244, 63, 94, .15);
      }
    }

    /* ============ Skeleton ============ */
    .nb-skel {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: nbSkel 1.8s infinite;
      border-radius: .75rem;
    }

    html.dark .nb-skel {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
    }

    @keyframes nbSkel {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* ============ View toggle ============ */
    .nb-view-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: .5rem;
      color: #94a3b8;
      transition: color .18s ease, background-color .18s ease;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .nb-view-btn:hover {
      color: #e2e8f0;
    }

    html:not(.dark) .nb-view-btn:hover {
      color: #0f172a;
    }

    .nb-view-btn.active {
      background: #4f46e5;
      color: #fff;
      box-shadow: 0 2px 8px -2px rgba(79, 70, 229, .5);
    }

    /* ============ Filter chip ============ */
    .nb-chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .35rem .7rem;
      border-radius: .5rem;
      font-size: .75rem;
      font-weight: 600;
      background: rgba(99, 102, 241, .1);
      color: #6366f1;
      border: 1px solid rgba(99, 102, 241, .25);
      transition: background .18s ease;
    }

    html.dark .nb-chip {
      color: #a5b4fc;
    }

    .nb-chip button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1rem;
      height: 1rem;
      border-radius: 999px;
      background: rgba(99, 102, 241, .2);
      color: inherit;
      border: 0;
      cursor: pointer;
      font-size: .55rem;
      padding: 0;
    }

    .nb-chip button:hover {
      background: rgba(99, 102, 241, .4);
    }

    /* ============ Pagination btn ============ */
    .nb-page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.25rem;
      height: 2.25rem;
      padding: 0 .65rem;
      border-radius: .625rem;
      font-size: .75rem;
      font-weight: 700;
      background: transparent;
      border: 1px solid var(--card-bd-l);
      color: #64748b;
      cursor: pointer;
      transition: all .18s ease;
    }

    .nb-page-btn:hover:not(:disabled):not(.active) {
      border-color: rgba(99, 102, 241, .5);
      color: #6366f1;
    }

    .nb-page-btn.active {
      background: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
      box-shadow: 0 4px 12px -2px rgba(79, 70, 229, .4);
    }

    .nb-page-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    html.dark .nb-page-btn {
      border-color: #1e293b;
      color: #94a3b8;
    }

    html.dark .nb-page-btn:hover:not(:disabled):not(.active) {
      border-color: rgba(99, 102, 241, .5);
      color: #a5b4fc;
    }

    /* ============ Focus ============ */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid rgb(var(--ring));
      outline-offset: 2px;
      border-radius: .5rem;
    }

    /* ============ Warm greeting ============ */
    .nb-greeting {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      font-size: .75rem;
      font-weight: 700;
      color: #6366f1;
      background: rgba(99, 102, 241, .08);
      border: 1px solid rgba(99, 102, 241, .18);
      padding: .3rem .7rem;
      border-radius: 999px;
      letter-spacing: .01em;
    }

    html.dark .nb-greeting {
      color: #a5b4fc;
      background: rgba(99, 102, 241, .14);
      border-color: rgba(99, 102, 241, .28);
    }

    /* ============ Reduced motion ============ */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body
  class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <header id="nb-header"></header>

  <main class="flex-1 w-full">

    <!-- ═══════════ HEADER / HERO ═══════════ -->
    <section
      class="border-b border-slate-200 dark:border-slate-800/80 bg-gradient-to-b from-indigo-50/60 dark:from-indigo-950/30 to-transparent">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-7">
        <!-- Breadcrumb -->
        <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-xs text-slate-500 mb-3 font-medium">
          <a href="/" class="hover:text-indigo-500 transition-colors">Home</a>
          <i class="fa-solid fa-chevron-right text-[9px] opacity-50" aria-hidden="true"></i>
          <span class="text-slate-700 dark:text-slate-300">Auctions</span>
        </nav>

        <div class="flex flex-col md:flex-row md:items-end justify-between gap-5">
          <div>
            <span class="nb-greeting mb-3">
              <i class="fa-solid fa-hand-sparkles text-[10px]" aria-hidden="true"></i>
              <span id="greeting-text">Salam! Here's what's live right now</span>
            </span>

            <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black text-slate-900 dark:text-slate-100 tracking-tight">
              Explore Live Auctions
            </h1>
            <p class="text-sm text-slate-600 dark:text-slate-400 mt-2 max-w-2xl">
              Every listing is checked by our team, every seller is CNIC-verified, and your money stays in escrow
              until you say the item arrived safely.
            </p>
          </div>

          <!-- Live indicator -->
          <div
            class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/25 self-start">
            <span class="relative flex w-2 h-2">
              <span
                class="absolute inline-flex w-full h-full rounded-full bg-emerald-500 opacity-75 animate-ping"></span>
              <span class="relative inline-flex w-2 h-2 rounded-full bg-emerald-500"></span>
            </span>
            <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400">Watching for you, live</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════ FILTER BAR ═══════════ -->
    <section
      class="border-b border-slate-200 dark:border-slate-800/80 bg-white/60 dark:bg-slate-900/40 backdrop-blur-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex flex-col lg:flex-row lg:items-center gap-3">

          <!-- Search -->
          <div class="relative flex-1 min-w-0">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"
              aria-hidden="true"></i>
            <input type="search" id="filter-search" placeholder="Try 'iPhone', 'Civic', 'gold necklace'…"
              class="nb-input" style="padding-left: 2.25rem;" autocomplete="off" aria-label="Search auctions">
          </div>

          <!-- Filters row -->
          <div class="grid grid-cols-2 sm:flex sm:flex-nowrap items-center gap-2.5">
            <select id="filter-category" class="nb-select" aria-label="Filter by category">
              <option value="">Every category</option>
            </select>

            <select id="filter-sort" class="nb-select" aria-label="Sort auctions">
              <option value="ending_soon">Ending soonest</option>
              <option value="newest">Fresh arrivals</option>
              <option value="highest_bid">Priciest first</option>
              <option value="lowest_bid">Most affordable</option>
            </select>

            <button type="button" id="btn-reset"
              class="nb-btn hidden sm:inline-flex items-center justify-center gap-1.5 px-3 h-[38px] rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
              title="Start over">
              <i class="fa-solid fa-rotate-left text-[10px]" aria-hidden="true"></i>
              <span>Start over</span>
            </button>

            <!-- View toggle -->
            <div
              class="col-span-2 sm:col-span-1 flex items-center justify-center sm:justify-start gap-1 p-1 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-800">
              <button type="button" id="view-grid-btn" class="nb-view-btn" title="Grid view" aria-label="Grid view">
                <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
              </button>
              <button type="button" id="view-list-btn" class="nb-view-btn" title="List view" aria-label="List view">
                <i class="fa-solid fa-list" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Active filters + count -->
        <div class="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div id="active-filter-chips" class="flex flex-wrap items-center gap-2" aria-live="polite"></div>
          <div id="results-count"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium order-first sm:order-last"></div>
        </div>
      </div>
    </section>

    <!-- ═══════════ AUCTIONS ═══════════ -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div id="auctions-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
      <div id="pagination-controls" class="mt-12 flex items-center justify-center gap-1.5 flex-wrap"></div>
    </section>

  </main>

  <footer id="nb-footer"></footer>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/ai-chat.js"></script>

  <script>
    (function () {
      'use strict';

      /* ============================================================
       * State
       * ============================================================ */
      const state = {
        page: 1,
        viewMode: localStorage.getItem('nb_auctions_view') || 'grid',
        search: '',
        category: '',
        sort: 'ending_soon',
        auctions: [],
        watchedIds: new Set(),
        watchedLoaded: false,
        meta: { total: 0, totalPages: 1 },
        loading: false,
      };

      let searchDebounce = null;
      let countdownTimer = null;
      const els = {};

      /* ============================================================
       * Utilities
       * ============================================================ */
      function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function encodeId(id) {
        return encodeURIComponent(String(id ?? ''));
      }

      function debounce(fn, ms) {
        return function (...args) {
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(() => fn.apply(this, args), ms);
        };
      }

      /* ============================================================
       * URL sync
       * ============================================================ */
      function readURL() {
        const p = new URLSearchParams(window.location.search);
        state.search = p.get('search') || '';
        state.category = p.get('category') || '';
        state.sort = p.get('sort') || 'ending_soon';
        state.page = Math.max(1, parseInt(p.get('page') || '1', 10) || 1);
        const v = p.get('view');
        if (v === 'grid' || v === 'list') state.viewMode = v;
      }

      function writeURL() {
        const p = new URLSearchParams();
        if (state.search) p.set('search', state.search);
        if (state.category) p.set('category', state.category);
        if (state.sort && state.sort !== 'ending_soon') p.set('sort', state.sort);
        if (state.viewMode !== 'grid') p.set('view', state.viewMode);
        if (state.page > 1) p.set('page', String(state.page));

        const qs = p.toString();
        const url = qs ? `${window.location.pathname}?${qs}` : window.location.pathname;
        window.history.replaceState({}, '', url);
      }

      /* ============================================================
       * Loading / empty states
       * ============================================================ */
      function renderSkeletons(count) {
        const c = els.container;
        if (!c) return;

        const item = `
          <div class="rounded-2xl border border-slate-200 dark:border-slate-800/80 overflow-hidden bg-white dark:bg-slate-900/70">
            <div class="nb-skel h-48 rounded-none"></div>
            <div class="p-4 space-y-3">
              <div class="nb-skel h-3 w-1/3"></div>
              <div class="nb-skel h-4 w-full"></div>
              <div class="nb-skel h-4 w-2/3"></div>
              <div class="flex justify-between items-center pt-3">
                <div class="nb-skel h-6 w-24"></div>
                <div class="nb-skel h-9 w-16"></div>
              </div>
            </div>
          </div>
        `;
        c.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5';
        c.innerHTML = Array.from({ length: count }, () => item).join('');
      }

      function renderEmptyState(opts) {
        const c = els.container;
        if (!c) return;
        c.className = 'grid grid-cols-1';
        c.innerHTML = `
          <div class="text-center py-16 px-6 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700/80 bg-white/50 dark:bg-slate-900/30">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mb-4">
              <i class="fa-solid ${escapeHtml(opts.icon || 'fa-gavel')} text-2xl text-slate-400 dark:text-slate-500" aria-hidden="true"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800 dark:text-slate-200 mb-1.5">${escapeHtml(opts.title || 'Nothing here')}</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto">${escapeHtml(opts.description || '')}</p>
            ${opts.actionText ? `
              <button type="button" id="empty-action" class="inline-flex items-center gap-2 mt-5 px-4 h-10 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 transition-colors">
                <span>${escapeHtml(opts.actionText)}</span>
              </button>
            ` : ''}
          </div>
        `;
        if (opts.onAction) {
          const b = document.getElementById('empty-action');
          if (b) b.addEventListener('click', () => { opts.onAction(); });
        }
      }

      /* ============================================================
       * Init
       * ============================================================ */
      function init() {
        els.container = document.getElementById('auctions-container');
        els.search = document.getElementById('filter-search');
        els.category = document.getElementById('filter-category');
        els.sort = document.getElementById('filter-sort');
        els.chips = document.getElementById('active-filter-chips');
        els.count = document.getElementById('results-count');
        els.pagination = document.getElementById('pagination-controls');
        els.gridBtn = document.getElementById('view-grid-btn');
        els.listBtn = document.getElementById('view-list-btn');
        els.resetBtn = document.getElementById('btn-reset');

        readURL();

        if (els.search) els.search.value = state.search;
        if (els.sort) els.sort.value = state.sort;
        syncViewButtons();

        if (els.search) {
          els.search.addEventListener('input', debounce(() => {
            state.search = els.search.value.trim();
            state.page = 1;
            loadAuctions();
          }, 350));
        }
        if (els.category) {
          els.category.addEventListener('change', () => {
            state.category = els.category.value;
            state.page = 1;
            loadAuctions();
          });
        }
        if (els.sort) {
          els.sort.addEventListener('change', () => {
            state.sort = els.sort.value;
            state.page = 1;
            loadAuctions();
          });
        }
        if (els.gridBtn) els.gridBtn.addEventListener('click', () => setViewMode('grid'));
        if (els.listBtn) els.listBtn.addEventListener('click', () => setViewMode('list'));
        if (els.resetBtn) els.resetBtn.addEventListener('click', clearFilters);

        if (els.pagination) {
          els.pagination.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-page]');
            if (!btn || btn.disabled) return;
            const p = parseInt(btn.getAttribute('data-page'), 10);
            if (!isNaN(p) && p !== state.page) loadAuctions(p);
          });
        }

        if (els.chips) {
          els.chips.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-remove]');
            if (!btn) return;
            const k = btn.getAttribute('data-remove');
            if (k === 'search') { state.search = ''; if (els.search) els.search.value = ''; }
            if (k === 'category') { state.category = ''; if (els.category) els.category.value = ''; }
            if (k === 'sort') { state.sort = 'ending_soon'; if (els.sort) els.sort.value = 'ending_soon'; }
            state.page = 1;
            loadAuctions();
          });
        }

        window.addEventListener('popstate', () => {
          readURL();
          if (els.search) els.search.value = state.search;
          if (els.sort) els.sort.value = state.sort;
          if (els.category) els.category.value = state.category;
          syncViewButtons();
          loadAuctions(state.page);
        });

        loadCategories().then(() => loadAuctions(state.page));
      }

      /* ============================================================
       * View mode
       * ============================================================ */
      function setViewMode(mode) {
        state.viewMode = mode;
        localStorage.setItem('nb_auctions_view', mode);
        syncViewButtons();
        renderAuctions();
        writeURL();
      }

      function syncViewButtons() {
        if (!els.gridBtn || !els.listBtn) return;
        els.gridBtn.classList.toggle('active', state.viewMode === 'grid');
        els.listBtn.classList.toggle('active', state.viewMode === 'list');
        els.gridBtn.setAttribute('aria-pressed', String(state.viewMode === 'grid'));
        els.listBtn.setAttribute('aria-pressed', String(state.viewMode === 'list'));
      }

      /* ============================================================
       * Categories
       * ============================================================ */
      async function loadCategories() {
        if (!els.category) return;
        try {
          const res = await ApiClient.get('/categories');
          const cats = (res && res.data) ? res.data : [];

          const seen = new Set();
          const unique = cats.filter(c => {
            const k = String(c && c.category_name || '').toLowerCase().trim();
            if (!k || seen.has(k)) return false;
            seen.add(k);
            return true;
          });

          const current = els.category.value;
          els.category.innerHTML = '<option value="">Every category</option>' +
            unique.map(c => {
              const count = c.active_auction_count ?? c.auction_count ?? 0;
              return `<option value="${escapeHtml(c.category_id)}">${escapeHtml(c.category_name)} (${escapeHtml(count)})</option>`;
            }).join('');

          if (state.category) els.category.value = state.category;
          else if (current) els.category.value = current;
        } catch (err) {
          console.warn('[auctions] Category load failed:', err);
        }
      }

      /* ============================================================
       * Load auctions
       * ============================================================ */
      async function loadAuctions(page = 1) {
        if (state.loading) return;
        state.loading = true;
        state.page = Math.max(1, page | 0);
        writeURL();

        renderSkeletons(8);
        els.pagination.innerHTML = '';
        renderChips();

        try {
          const params = { page: state.page, limit: 12, status: 'active', sort: state.sort };
          if (state.search) params.search = state.search;
          if (state.category) params.category_id = state.category;

          const res = await ApiClient.get('/auctions', params);
          state.auctions = (res && res.data) ? res.data : [];
          state.meta = (res && res.meta)
            ? res.meta
            : { total: state.auctions.length, totalPages: 1 };

          if (ApiClient.isAuthenticated() && !state.watchedLoaded) {
            try {
              const wRes = await ApiClient.get('/watchlist');
              if (wRes && Array.isArray(wRes.data)) {
                state.watchedIds = new Set(wRes.data.map(i => Number(i.auction_id)));
                state.watchedLoaded = true;
              }
            } catch (e) { }
          }

          renderAuctions();
          renderPagination();
          renderCount();
          startCountdown();
        } catch (err) {
          console.error('[auctions] Load failed:', err);
          renderEmptyState({
            icon: 'fa-triangle-exclamation',
            title: 'Unable to load auctions',
            description: err && err.message ? err.message : 'Please check your connection and try again.',
            actionText: 'Try again',
            onAction: () => loadAuctions(state.page),
          });
        } finally {
          state.loading = false;
        }
      }

      /* ============================================================
       * Render — grid / list
       * ============================================================ */
      function renderAuctions() {
        const c = els.container;
        if (!c) return;

        if (!state.auctions.length) {
          renderEmptyState({
            icon: 'fa-gavel',
            title: 'Nothing matches — yet',
            description: 'Try a different keyword or open up the category filter. New auctions are added throughout the day.',
            actionText: 'Start over',
            onAction: clearFilters,
          });
          return;
        }

        if (state.viewMode === 'list') {
          c.className = 'flex flex-col gap-4';
          c.innerHTML = state.auctions.map(renderListCard).join('');
        } else {
          c.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5';
          c.innerHTML = state.auctions.map(renderGridCard).join('');
        }
      }

      function renderCount() {
        if (!els.count) return;
        const total = state.meta.total || state.auctions.length;
        if (!total) { els.count.textContent = ''; return; }
        const start = (state.page - 1) * 12 + 1;
        const end = Math.min(state.page * 12, total);
        els.count.innerHTML = `Showing <span class="tabular-nums font-semibold text-slate-700 dark:text-slate-300">${start}–${end}</span> of <span class="tabular-nums font-semibold text-slate-700 dark:text-slate-300">${total}</span> live auctions`;
      }

      function renderChips() {
        if (!els.chips) return;
        const chips = [];
        if (state.search) {
          chips.push(`<span class="nb-chip"><i class="fa-solid fa-magnifying-glass text-[10px]" aria-hidden="true"></i> ${escapeHtml(state.search)} <button type="button" data-remove="search" aria-label="Remove search filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></span>`);
        }
        if (state.category && els.category) {
          const opt = els.category.options[els.category.selectedIndex];
          if (opt && opt.value) {
            chips.push(`<span class="nb-chip"><i class="fa-solid fa-tag text-[10px]" aria-hidden="true"></i> ${escapeHtml(opt.textContent.replace(/\s*\(\d+\)\s*$/, ''))} <button type="button" data-remove="category" aria-label="Remove category filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></span>`);
          }
        }
        if (state.sort && state.sort !== 'ending_soon' && els.sort) {
          const opt = els.sort.options[els.sort.selectedIndex];
          if (opt) {
            chips.push(`<span class="nb-chip"><i class="fa-solid fa-arrow-down-wide-short text-[10px]" aria-hidden="true"></i> ${escapeHtml(opt.textContent)} <button type="button" data-remove="sort" aria-label="Remove sort filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></span>`);
          }
        }
        els.chips.innerHTML = chips.join('');
        if (els.resetBtn) {
          els.resetBtn.classList.toggle('hidden', chips.length === 0);
          els.resetBtn.classList.toggle('sm:inline-flex', chips.length > 0);
        }
      }

      /* ============================================================
       * Countdown badge — theme-aware
       * ============================================================ */
      function countdownBadge(endTime, urgent) {
        const cd = (window.UI && UI.formatCountdown) ? UI.formatCountdown(endTime) : { text: '', ended: false, isUrgent: false };
        const isUrgent = urgent || cd.isUrgent;
        return `
          <span class="nb-overlay-countdown ${isUrgent ? 'is-urgent nb-urgent' : ''} inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold tracking-wide">
            <i class="fa-regular fa-clock" aria-hidden="true"></i>
            <span data-end-time="${escapeHtml(endTime)}">${cd.ended ? 'Ended' : escapeHtml(cd.text) + ' left'}</span>
          </span>
        `;
      }

      /* ============================================================
       * Heart button markup
       * ============================================================ */
      function heartButtonMarkup(auctionId, isWatched, extraClass) {
        const iconCls = isWatched ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
        const title = isWatched ? 'Remove from saved' : 'Save for later';
        const watchedClass = isWatched ? 'is-watched' : '';
        return `
          <button type="button"
                  class="nb-heart-btn ${watchedClass} ${extraClass || ''}"
                  title="${title}"
                  aria-label="${title}"
                  aria-pressed="${isWatched}"
                  onclick="event.stopPropagation(); window.toggleCardWatchlist(${auctionId}, this)">
            <i class="${iconCls}"></i>
          </button>
        `;
      }

      /* ============================================================
       * Grid card
       * ============================================================ */
      function renderGridCard(a) {
        const img = a.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600';
        const price = (window.UI && UI.formatPKR)
          ? UI.formatPKR(a.current_bid || a.starting_price || 0)
          : `Rs ${a.current_bid || a.starting_price || 0}`;
        const bidCount = Number(a.bid_count || 0);
        const isWatched = state.watchedIds && state.watchedIds.has(Number(a.auction_id));
        const sellerInitial = String(a.seller_name || 'S').trim().charAt(0).toUpperCase();

        return `
          <article class="nb-card group relative rounded-2xl bg-white dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800/90 overflow-hidden flex flex-col shadow-sm">
            <div class="relative h-48 overflow-hidden bg-slate-100 dark:bg-slate-800">
              <img src="${escapeHtml(img)}" alt="${escapeHtml(a.title || 'Auction item')}" loading="lazy"
                   class="nb-card-img w-full h-full object-cover"
                   onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'">
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-slate-950/0 to-transparent pointer-events-none"></div>

              <div class="absolute top-3 inset-x-3 flex items-start justify-between gap-2 pointer-events-none">
                ${countdownBadge(a.end_time)}
                <div class="flex items-center gap-1.5 pointer-events-auto">
                  ${bidCount > 0 ? `
                    <span class="nb-overlay-bidcount inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold">
                      <i class="fa-solid fa-gavel text-[10px]" aria-hidden="true"></i> ${bidCount}
                    </span>` : ''}
                  ${heartButtonMarkup(a.auction_id, isWatched)}
                </div>
              </div>

              <div class="absolute bottom-3 left-3 pointer-events-none">
                <span class="nb-overlay-category px-2.5 py-1 rounded-md text-[10px] font-black uppercase">
                  ${escapeHtml(a.category_name || 'Auction')}
                </span>
              </div>
            </div>

            <div class="p-4 flex-1 flex flex-col">
              <!-- Seller -->
              <div class="flex items-center gap-2.5 mb-2.5">
                <div class="w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-indigo-600 shadow-sm shadow-indigo-500/30 flex items-center justify-center text-[11px] font-black text-white shrink-0">
                  ${escapeHtml(sellerInitial)}
                </div>
                <div class="min-w-0 flex-1">
                  <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 leading-none">Seller</p>
                  <p class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate mt-0.5" title="${escapeHtml(a.seller_name || 'Verified Seller')}">
                    ${escapeHtml(a.seller_name || 'Verified Seller')}
                  </p>
                </div>
                <i class="fa-solid fa-circle-check text-emerald-500 text-xs shrink-0" title="Verified seller" aria-label="Verified seller"></i>
              </div>

              <!-- Title -->
              <h3 class="text-sm font-bold text-slate-900 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors line-clamp-2 leading-snug mb-4">
                <a href="/auction-details.html?id=${encodeId(a.auction_id)}">${escapeHtml(a.title || 'Untitled auction')}</a>
              </h3>

              <!-- Price + action -->
              <div class="mt-auto pt-3 border-t border-slate-200 dark:border-slate-800/80 flex items-end justify-between gap-2">
                <div class="min-w-0">
                  <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Current bid</p>
                  <p class="text-base sm:text-lg font-black text-emerald-600 dark:text-emerald-400 leading-none mt-1 tabular-nums truncate">
                    ${escapeHtml(price)}
                  </p>
                </div>

                <a href="/auction-details.html?id=${encodeId(a.auction_id)}" class="nb-bid-btn shrink-0">
                  <span>Bid</span>
                  <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </a>
              </div>
            </div>
          </article>
        `;
      }

      /* ============================================================
       * List card
       * ============================================================ */
      function renderListCard(a) {
        const img = a.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400';
        const price = (window.UI && UI.formatPKR)
          ? UI.formatPKR(a.current_bid || a.starting_price || 0)
          : `Rs ${a.current_bid || a.starting_price || 0}`;
        const cd = (window.UI && UI.formatCountdown) ? UI.formatCountdown(a.end_time) : { text: '', ended: false };
        const bidCount = Number(a.bid_count || 0);
        const isWatched = state.watchedIds && state.watchedIds.has(Number(a.auction_id));

        return `
          <article class="nb-card group rounded-2xl bg-white dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800/90 overflow-hidden flex flex-col sm:flex-row gap-4 p-4 shadow-sm">
            <div class="relative w-full sm:w-52 h-40 sm:h-36 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 shrink-0">
              <img src="${escapeHtml(img)}" alt="${escapeHtml(a.title || 'Auction item')}" loading="lazy"
                   class="nb-card-img w-full h-full object-cover"
                   onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'">
              <div class="absolute bottom-2 left-2">
                <span class="nb-overlay-category px-2.5 py-1 rounded-md text-[10px] font-black uppercase">
                  ${escapeHtml(a.category_name || 'Auction')}
                </span>
              </div>
            </div>

            <div class="flex-1 min-w-0 flex flex-col">
              <div class="flex items-center gap-2.5 mb-2 flex-wrap">
                <span class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-800 dark:text-slate-100 truncate">
                  <i class="fa-solid fa-circle-check text-emerald-500 text-[11px]" aria-hidden="true"></i>
                  ${escapeHtml(a.seller_name || 'Verified Seller')}
                </span>
                ${bidCount > 0 ? `
                  <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/40 px-2 py-0.5 rounded-md">
                    <i class="fa-solid fa-gavel text-[10px]" aria-hidden="true"></i> ${bidCount} ${bidCount === 1 ? 'bid' : 'bids'}
                  </span>` : ''}
              </div>

              <h3 class="text-base font-bold text-slate-900 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors line-clamp-1 leading-snug mb-1">
                <a href="/auction-details.html?id=${encodeId(a.auction_id)}">${escapeHtml(a.title || 'Untitled auction')}</a>
              </h3>

              ${a.description ? `<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed mb-3">${escapeHtml(a.description)}</p>` : ''}

              <div class="mt-auto pt-3 border-t border-slate-200 dark:border-slate-800/80 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-6">
                  <div>
                    <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Highest bid</p>
                    <p class="text-base font-black text-emerald-600 dark:text-emerald-400 leading-none mt-1 tabular-nums">${escapeHtml(price)}</p>
                  </div>
                  <div>
                    <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Remaining</p>
                    <p class="text-xs font-bold text-slate-700 dark:text-slate-200 mt-1 tabular-nums ${cd.isUrgent ? 'text-rose-500 dark:text-rose-400' : ''}" data-end-time="${escapeHtml(a.end_time)}">${cd.ended ? 'Ended' : escapeHtml(cd.text)}</p>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  ${heartButtonMarkup(a.auction_id, isWatched, 'w-10 h-10 !text-base shrink-0')}

                  <a href="/auction-details.html?id=${encodeId(a.auction_id)}" class="nb-bid-btn shrink-0">
                    <span>Place bid</span>
                    <i class="fa-solid fa-gavel" aria-hidden="true"></i>
                  </a>
                </div>
              </div>
            </div>
          </article>
        `;
      }

      /* ============================================================
       * Pagination
       * ============================================================ */
      function paginationRange(current, total) {
        if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);

        const delta = 1;
        const range = [];
        const out = [];
        for (let i = 1; i <= total; i++) {
          if (i === 1 || i === total || (i >= current - delta && i <= current + delta)) range.push(i);
        }
        let last;
        for (const i of range) {
          if (last) {
            if (i - last === 2) out.push(last + 1);
            else if (i - last !== 1) out.push('...');
          }
          out.push(i);
          last = i;
        }
        return out;
      }

      function renderPagination() {
        const c = els.pagination;
        if (!c) return;
        const total = state.meta.totalPages || 1;
        if (total <= 1) { c.innerHTML = ''; return; }

        const parts = [];
        parts.push(`<button type="button" class="nb-page-btn" data-page="${state.page - 1}" ${state.page <= 1 ? 'disabled' : ''} aria-label="Previous page"><i class="fa-solid fa-chevron-left text-[10px]" aria-hidden="true"></i></button>`);

        paginationRange(state.page, total).forEach(item => {
          if (item === '...') {
            parts.push(`<span class="nb-page-btn" style="border:0;background:transparent;cursor:default" aria-hidden="true">…</span>`);
          } else {
            parts.push(`<button type="button" class="nb-page-btn ${item === state.page ? 'active' : ''}" data-page="${item}" aria-label="Page ${item}" ${item === state.page ? 'aria-current="page"' : ''}>${item}</button>`);
          }
        });

        parts.push(`<button type="button" class="nb-page-btn" data-page="${state.page + 1}" ${state.page >= total ? 'disabled' : ''} aria-label="Next page"><i class="fa-solid fa-chevron-right text-[10px]" aria-hidden="true"></i></button>`);

        c.innerHTML = parts.join('');
      }

      /* ============================================================
       * Countdown ticker
       * ============================================================ */
      function startCountdown() {
        if (countdownTimer) clearInterval(countdownTimer);
        if (!window.UI || typeof UI.formatCountdown !== 'function') return;

        countdownTimer = setInterval(() => {
          document.querySelectorAll('[data-end-time]').forEach(el => {
            const endTime = el.getAttribute('data-end-time');
            if (!endTime) return;
            const cd = UI.formatCountdown(endTime);
            const isBadge = el.closest('.rounded-full') !== null;
            if (isBadge) el.textContent = cd.ended ? 'Ended' : `${cd.text} left`;
            else el.textContent = cd.ended ? 'Ended' : cd.text;
          });
        }, 1000);
      }

      /* ============================================================
       * Clear filters
       * ============================================================ */
      function clearFilters() {
        state.search = '';
        state.category = '';
        state.sort = 'ending_soon';
        state.page = 1;
        if (els.search) els.search.value = '';
        if (els.category) els.category.value = '';
        if (els.sort) els.sort.value = 'ending_soon';
        loadAuctions(1);
      }

      /* ============================================================
       * Watchlist toggle
       * ============================================================ */
      window.toggleCardWatchlist = async function (auctionId, btnEl) {
        if (!ApiClient.isAuthenticated()) {
          if (window.UI && UI.showToast) UI.showToast('Sign in to save items for later', 'info');
          else window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}`;
          return;
        }

        const idNum = Number(auctionId);
        const isWatched = state.watchedIds && state.watchedIds.has(idNum);
        const icon = btnEl ? btnEl.querySelector('i') : null;

        try {
          if (isWatched) {
            await ApiClient.delete(`/watchlist/${idNum}`);
            state.watchedIds.delete(idNum);
            if (icon) icon.className = 'fa-regular fa-heart';
            if (btnEl) {
              btnEl.classList.remove('is-watched');
              btnEl.title = 'Save for later';
              btnEl.setAttribute('aria-pressed', 'false');
            }
            if (window.UI && UI.showToast) UI.showToast('Removed from your saved items', 'info');
          } else {
            await ApiClient.post(`/watchlist/${idNum}`);
            state.watchedIds.add(idNum);
            if (icon) icon.className = 'fa-solid fa-heart';
            if (btnEl) {
              btnEl.classList.add('is-watched');
              btnEl.title = 'Remove from saved';
              btnEl.setAttribute('aria-pressed', 'true');
            }
            if (window.UI && UI.showToast) UI.showToast('Saved — we\'ll keep an eye on it for you', 'success');
          }
        } catch (err) {
          if (window.UI && UI.showToast) UI.showToast((err && err.message) || 'Could not update your saved items', 'error');
        }
      };

      /* ============================================================
       * Go
       * ============================================================ */
      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
