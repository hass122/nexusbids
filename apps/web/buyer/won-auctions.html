<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Won Auctions — NexusBids Pakistan</title>
  <meta name="description" content="View all auctions you have won on NexusBids and proceed to checkout.">
  <script>(function(){var t=localStorage.getItem('nexusbids_theme')||'system';var d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.classList.toggle('dark',d);document.documentElement.setAttribute('data-theme',d?'dark':'light');})();</script>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']},colors:{brand:{400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca'}}}}};</script>
  <style>
    :root{--w-bg:#f4f6fb;--w-surface:#fff;--w-surface-2:#f7f9fc;--w-surface-3:#eceff6;--w-border:#e3e8f0;--w-border-strong:#cfd7e5;--w-text:#0f172a;--w-text-muted:#58627a;--w-text-light:#8d97ab;--w-shadow-sm:0 1px 2px rgba(15,23,42,.05);--w-shadow-md:0 6px 16px -6px rgba(15,23,42,.12);--w-skeleton:linear-gradient(90deg,#eef1f7 25%,#e3e8f2 37%,#eef1f7 63%)}
    html.dark{--w-bg:#05070f;--w-surface:#0d1220;--w-surface-2:#121a2b;--w-surface-3:#1a2336;--w-border:#1e2a40;--w-border-strong:#2c3a56;--w-text:#eef2f9;--w-text-muted:#9aa6bd;--w-text-light:#66738d;--w-shadow-sm:0 1px 2px rgba(0,0,0,.45);--w-shadow-md:0 8px 22px -8px rgba(0,0,0,.65);--w-skeleton:linear-gradient(90deg,#121a2b 25%,#1b2437 37%,#121a2b 63%)}
    *,*::before,*::after{box-sizing:border-box}
    body.page{background:var(--w-bg);color:var(--w-text);-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s;overflow-x:hidden}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6366f1;background:rgba(99,102,241,.10);border:1px solid rgba(99,102,241,.20);padding:5px 11px;border-radius:999px}
    html.dark .eyebrow{color:#a5b4fc;background:rgba(99,102,241,.14);border-color:rgba(99,102,241,.25)}
    .page-title{font-size:clamp(1.55rem,4.2vw,2.15rem);font-weight:800;letter-spacing:-.025em;line-height:1.12;color:var(--w-text)}
    .page-sub{font-size:.84rem;color:var(--w-text-muted);margin-top:7px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:12px;font-size:.78rem;font-weight:700;line-height:1;border:1px solid transparent;text-decoration:none;white-space:nowrap;cursor:pointer;transition:all .22s}
    .btn:focus-visible{outline:2px solid #6366f1;outline-offset:2px}
    .btn-ghost{background:var(--w-surface);border-color:var(--w-border);color:var(--w-text-muted);box-shadow:var(--w-shadow-sm)}
    .btn-ghost:hover{color:var(--w-text);border-color:var(--w-border-strong);transform:translateY(-1px);box-shadow:var(--w-shadow-md)}
    .btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 8px 20px -8px rgba(79,70,229,.8)}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px -8px rgba(79,70,229,.9)}
    .won-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
    .won-card{background:var(--w-surface);border:1px solid var(--w-border);border-radius:20px;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
    .won-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -16px rgba(99,102,241,.25);border-color:rgba(99,102,241,.35)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .won-img{position:relative;width:100%;height:180px;overflow:hidden;background:var(--w-surface-3)}
    .won-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
    .won-card:hover .won-img img{transform:scale(1.06)}
    .won-trophy{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(99,102,241,.9);color:#fff;font-size:.64rem;font-weight:800;backdrop-filter:blur(6px)}
    .won-body{padding:14px 16px}
    .won-title{font-size:.9rem;font-weight:700;color:var(--w-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;text-decoration:none;transition:color .2s}
    .won-title:hover{color:#6366f1}
    html.dark .won-title:hover{color:#a5b4fc}
    .won-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;flex-wrap:wrap}
    .won-amount{font-size:1.05rem;font-weight:800;color:var(--w-text);font-variant-numeric:tabular-nums}
    .won-date{font-size:.68rem;color:var(--w-text-light)}
    .won-actions{padding:12px 16px;border-top:1px solid var(--w-border);display:flex;gap:8px}
    .skeleton{background:var(--w-skeleton);background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 20px;gap:12px}
    .spin{animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body class="page min-h-screen flex flex-col font-sans">
  <header id="nb-header"></header>
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 w-full">

    <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-5 mb-7">
      <div>
        <span class="eyebrow"><i class="fa-solid fa-trophy"></i> Victories</span>
        <h1 class="page-title mt-3">Won Auctions</h1>
        <p class="page-sub">Auctions you've successfully won — proceed to payment and complete your orders.</p>
      </div>
      <div class="flex items-center gap-2.5">
        <button id="refresh-btn" class="btn btn-ghost" type="button">
          <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> <span class="hidden sm:inline">Refresh</span>
        </button>
        <a href="/buyer/orders.html" class="btn btn-ghost"><i class="fa-solid fa-box" style="color:#6366f1"></i> My Orders</a>
      </div>
    </div>

    <!-- Summary bar -->
    <div id="won-summary" style="display:none;background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(168,85,247,.06));border:1px solid rgba(99,102,241,.2);border-radius:16px;padding:14px 20px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:36px;height:36px;border-radius:10px;background:rgba(99,102,241,.15);display:flex;align-items:center;justify-content:center">
          <i class="fa-solid fa-trophy" style="color:#6366f1;font-size:.9rem"></i>
        </div>
        <div>
          <div style="font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--w-text-muted)">Total Won</div>
          <div id="summary-count" style="font-size:1.25rem;font-weight:800;color:var(--w-text)">0</div>
        </div>
      </div>
      <div style="width:1px;height:32px;background:var(--w-border)"></div>
      <div>
        <div style="font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--w-text-muted)">Total Value</div>
        <div id="summary-value" style="font-size:1.25rem;font-weight:800;color:var(--w-text)">Rs. 0</div>
      </div>
      <div style="width:1px;height:32px;background:var(--w-border)"></div>
      <div>
        <div style="font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--w-text-muted)">Pending Payment</div>
        <div id="summary-pending" style="font-size:1.25rem;font-weight:800;color:#f59e0b">0</div>
      </div>
    </div>

    <div id="won-grid" class="won-grid"></div>
  </main>
  <footer id="nb-footer"></footer>
  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
  (function(){
    'use strict';
    const FB = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400';
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function fmt(v){return UI?.formatPKR?UI.formatPKR(v):'Rs. '+(Number(v)||0).toLocaleString('en-PK');}
    function fmtDate(d){return new Date(d).toLocaleDateString('en-PK',{day:'numeric',month:'short',year:'numeric'});}

    function renderSkeleton(n=6){
      return Array(n).fill(0).map(()=>`
        <div style="background:var(--w-surface);border:1px solid var(--w-border);border-radius:20px;overflow:hidden">
          <div style="height:180px" class="skeleton"></div>
          <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px">
            <div class="skeleton" style="height:14px;width:80%"></div>
            <div class="skeleton" style="height:12px;width:50%"></div>
            <div style="display:flex;gap:8px;margin-top:4px">
              <div class="skeleton" style="height:32px;flex:1;border-radius:10px"></div>
              <div class="skeleton" style="height:32px;width:80px;border-radius:10px"></div>
            </div>
          </div>
        </div>`).join('');
    }

    function renderCard(a){
      const img = a.image || FB;
      const paid = a.payment_status === 'paid' || a.payment_status === 'receipt_uploaded';
      const hasPending = !paid && !a.order_id;
      return `
      <div class="won-card">
        <div class="won-img">
          <img src="${esc(img)}" alt="${esc(a.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FB}'">
          <div class="won-trophy"><i class="fa-solid fa-trophy"></i> You Won!</div>
        </div>
        <div class="won-body">
          <a class="won-title" href="/auction-details.html?id=${encodeURIComponent(a.auction_id)}">${esc(a.title||'Auction')}</a>
          <div class="won-meta">
            <span class="won-amount">${esc(fmt(a.winning_bid||a.current_price))}</span>
            <span class="won-date">${esc(fmtDate(a.ended_at||a.end_time))}</span>
          </div>
        </div>
        <div class="won-actions">
          ${a.order_id
            ? `<a href="/buyer/order-details.html?id=${encodeURIComponent(a.order_id)}" class="btn btn-primary" style="flex:1;font-size:.75rem">
                <i class="fa-solid fa-box"></i> View Order
               </a>`
            : `<a href="/checkout.html?auction=${encodeURIComponent(a.auction_id)}" class="btn btn-primary" style="flex:1;font-size:.75rem">
                <i class="fa-solid fa-credit-card"></i> Pay Now
               </a>`
          }
          <a href="/auction-details.html?id=${encodeURIComponent(a.auction_id)}" class="btn btn-ghost" style="font-size:.75rem">
            <i class="fa-solid fa-eye"></i>
          </a>
        </div>
      </div>`;
    }

    async function load(){
      const grid = document.getElementById('won-grid');
      if(grid) grid.innerHTML = renderSkeleton();
      try {
        const res = await ApiClient.get('/buyer/won-auctions');
        const auctions = Array.isArray(res?.data) ? res.data : [];
        if(!auctions.length){
          if(grid) grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
              <div style="width:64px;height:64px;border-radius:20px;background:var(--w-surface-2);border:1px solid var(--w-border);display:grid;place-items:center;font-size:1.5rem;color:var(--w-text-light)">
                <i class="fa-solid fa-trophy"></i>
              </div>
              <h3 style="font-size:.95rem;font-weight:800;color:var(--w-text);margin:0">No auctions won yet</h3>
              <p style="font-size:.78rem;color:var(--w-text-muted);max-width:340px;line-height:1.55;margin:0">Start bidding on live auctions and you could win your first one today.</p>
              <a href="/auctions.html" class="btn btn-ghost" style="margin-top:4px"><i class="fa-solid fa-gavel"></i> Browse Auctions</a>
            </div>`;
          return;
        }

        // Summary
        const total = auctions.length;
        const value = auctions.reduce((s,a)=>s+(parseFloat(a.winning_bid||a.current_price)||0),0);
        const pending = auctions.filter(a=>!a.order_id).length;
        const sumBar = document.getElementById('won-summary');
        if(sumBar){ sumBar.style.display='flex'; }
        const sc = document.getElementById('summary-count'); if(sc) sc.textContent=total;
        const sv = document.getElementById('summary-value'); if(sv) sv.textContent=fmt(value);
        const sp = document.getElementById('summary-pending'); if(sp) sp.textContent=pending;

        if(grid) grid.innerHTML = auctions.map(renderCard).join('');
      } catch(err) {
        if(grid) grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;color:#ef4444"></i>
            <h3 style="font-size:.95rem;font-weight:800;color:var(--w-text);margin:0">Failed to load</h3>
            <p style="font-size:.78rem;color:var(--w-text-muted);margin:0">Could not fetch won auctions. Please refresh.</p>
            <button onclick="load()" class="btn btn-ghost" style="margin-top:4px"><i class="fa-solid fa-rotate-right"></i> Retry</button>
          </div>`;
      }
    }

    document.addEventListener('DOMContentLoaded',()=>{
      if(!ApiClient.getAccessToken()){window.location.href='/login.html?redirect=/buyer/won-auctions.html';return;}
      document.getElementById('refresh-btn')?.addEventListener('click',async()=>{
        const btn=document.getElementById('refresh-btn');
        const icon=document.getElementById('refresh-icon');
        btn.disabled=true; icon?.classList.add('spin');
        try{await load();}finally{btn.disabled=false;icon?.classList.remove('spin');}
      });
      load();
    });
  })();
  </script>
  <script src="/assets/js/ai-chat.js"></script>
</body>
</html>
