      var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches);
      document.documentElement.classList.toggle('dark', d);
      document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');

  <script>
    (function () {


      'use strict';

      // ✅ 1. DEEP VALUE EXTRACTOR (Handles any backend field name)
      function getVal(obj, keys, fallback = null) {
        if (!obj) return fallback;
        for (let k of keys) {
          if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
        }
        return fallback;
      }

      // ✅ 2. SAFE AMOUNT PARSER (Handles strings like "5,000 PKR")
      function parseAmount(val) {
        if (val === null || val === undefined) return 0;
        if (typeof val === 'number') return val;
        if (typeof val === 'string') {
          const num = parseFloat(val.replace(/[^0-9.]/g, ''));
          return isNaN(num) ? 0 : num;
        }
        return 0;
      }

      // ✅ 3. SAFE IMAGE URL FORMATTER (Handles base64, relative, objects)
      function getImageUrl(imgData) {
        const FALLBACK = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=1000&auto=format&fit=crop&q=80';
        if (!imgData) return FALLBACK;

        let str = '';
        if (typeof imgData === 'string') {
          str = imgData.trim();
        } else if (typeof imgData === 'object') {
          str = imgData.secure_url || imgData.url || imgData.path || imgData.image_url || imgData.image || '';
        }

        if (!str) return FALLBACK;
        if (str.startsWith('data:image')) return str;
        if (str.startsWith('http://') || str.startsWith('https://') || str.startsWith('//')) return str;
        if (str.startsWith('/')) return str;
        return '/' + str.replace(/^\/+/, '');
      }

      function escapeHtml(str) {
        if (str == null) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function initial(str, fallback = 'S') {
        const s = String(str || '').trim();
        return s ? s.charAt(0).toUpperCase() : fallback;
      }

      function fmtTime(ts) {
        try {
          const d = new Date(ts);
          if (isNaN(d.getTime())) return '';
          const now = Date.now();
          const diff = (now - d.getTime()) / 1000;
          if (diff < 60) return 'just now';
          if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
          if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
          return d.toLocaleDateString('en-PK', { month: 'short', day: 'numeric' });
        } catch { return ''; }
      }

      function fmtMoney(v) {
        const n = parseAmount(v);
        return 'Rs ' + n.toLocaleString('en-PK');
      }

      function fmtCompact(v) {
        const n = Math.abs(parseAmount(v));
        if (n >= 10000000) return (n / 10000000).toFixed(2).replace(/\.?0+$/, '') + ' Cr';
        if (n >= 100000) return (n / 100000).toFixed(2).replace(/\.?0+$/, '') + ' Lac';
        if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.?0+$/, '') + 'K';
        return String(n);
      }

      function cleanCountdown(text) {
        let s = String(text || '').trim();
        if (!s) return s;
        s = s.replace(/\b0d\b\s*/g, '').replace(/\b0h\b\s*/g, '').trim();
        return s || '0m';
      }

      function formatNumberInput(el) {
        if (!el) return;
        const raw = String(el.value || '').replace(/[^\d]/g, '');
        if (!raw) { el.value = ''; return; }
        el.value = Number(raw).toLocaleString('en-PK');
      }

      function parseFormattedNumber(str) {
        return parseFloat(String(str || '').replace(/[^\d.]/g, '')) || 0;
      }

      function toast(msg, type) {
        if (window.UI && typeof UI.showToast === 'function') UI.showToast(msg, type);
        else console.log(`[${type}] ${msg}`);
      }

      async function confirmDialog(opts) {
        if (window.UI && typeof UI.confirm === 'function') return UI.confirm(opts);
        return window.confirm(opts.message || 'Are you sure?');
      }

      const state = {
        auctionId: new URLSearchParams(window.location.search).get('id'),
        data: null,
        sse: null,
        ticker: null,
        isWatched: false,
        submitting: false,
      };

      const els = {};

      if (!state.auctionId) {
        window.location.replace('/auctions.html');
        return;
      }

      async function init() {
        els.root = document.getElementById('detail-root');
        els.mobileBar = document.getElementById('mobile-sticky-bid-bar');
        els.mobileBidBtn = document.getElementById('mobile-bid-btn');
        els.mobileBidValue = document.getElementById('mobile-sticky-bid');
        els.mobileTime = document.getElementById('mobile-sticky-time');

        if (els.mobileBidBtn) els.mobileBidBtn.addEventListener('click', scrollToBidBox);

        await loadAuction();
      }

      async function loadAuction() {
        try {
          const res = await ApiClient.get(`/auctions/${state.auctionId}`);

          // 🔍 DEBUG: Yeh console mein print hoga taake humein pata chale backend kya bhej raha hai
          console.log("=== BACKEND RESPONSE START ===");
          console.log(res);
          console.log("=== BACKEND RESPONSE END ===");

          let payload = (res && res.data) ? res.data : null;
          if (!payload) {
            alert("Backend se data nahi aa raha! Response: " + JSON.stringify(res));
            throw new Error('Auction not found');
          }

          // ✅ DEEP PARSE: Handle if backend wraps it in { auction: {...}, bids: [...] }
          let auctionData = payload.auction ? payload.auction : payload;
          let bidsData = payload.bids || auctionData.bids || [];

          // 🔍 DEBUG: Check exact fields
          console.log("Parsed Auction Data:", auctionData);
          console.log("Image Field Check:", auctionData.image || auctionData.image_url || auctionData.images || auctionData.thumbnail);
          console.log("Amount Field Check:", auctionData.current_bid || auctionData.starting_price || auctionData.price);

          // ✅ NORMALIZE FIELDS: Different backends use different field names
          state.data = {
            ...auctionData,
            // ID & Meta
            auction_id: getVal(auctionData, ['auction_id', 'id']),
            title: getVal(auctionData, ['title', 'name', 'item_name'], 'Untitled Auction'),
            description: getVal(auctionData, ['description', 'desc', 'details'], ''),

            // Pricing
            current_bid: parseAmount(getVal(auctionData, ['current_bid', 'current_price', 'highest_bid', 'price'])),
            starting_price: parseAmount(getVal(auctionData, ['starting_price', 'start_price', 'base_price'])),
            buy_now_price: getVal(auctionData, ['buy_now_price', 'buy_price']) ? parseAmount(getVal(auctionData, ['buy_now_price', 'buy_price'])) : null,
            reserve_price: getVal(auctionData, ['reserve_price', 'reserve']) ? parseAmount(getVal(auctionData, ['reserve_price', 'reserve'])) : null,
            bid_increment: parseAmount(getVal(auctionData, ['bid_increment', 'min_increment'])) || 500,

            // Images
            image: getVal(auctionData, ['image', 'image_url', 'thumbnail', 'cover_image']),
            images: auctionData.images || auctionData.gallery || [],

            // Auction Meta
            end_time: getVal(auctionData, ['end_time', 'end_date', 'ends_at']),
            category_name: getVal(auctionData, ['category_name', 'category']),
            location_city: getVal(auctionData, ['location_city', 'city', 'location']),
            condition: getVal(auctionData, ['condition', 'item_condition']),

            // Seller
            seller_name: getVal(auctionData, ['seller_name', 'seller', 'user_name'], 'Verified Seller'),
            seller_id: getVal(auctionData, ['seller_id', 'user_id']),
            seller_rating: parseAmount(getVal(auctionData, ['seller_rating', 'rating'])),
            seller_review_count: parseAmount(getVal(auctionData, ['seller_review_count', 'reviews_count'])),
            seller_joined_at: getVal(auctionData, ['seller_joined_at', 'joined_at']),

            // Counts
            bid_count: parseAmount(getVal(auctionData, ['bid_count', 'total_bids'])) || bidsData.length,
            watcher_count: parseAmount(getVal(auctionData, ['watcher_count', 'watch_count'])),
            is_watched: !!getVal(auctionData, ['is_watched', 'watched']),

            // Shipping
            shipping_cost: getVal(auctionData, ['shipping_cost', 'delivery_fee']),
            delivery_days: getVal(auctionData, ['delivery_days', 'estimated_delivery']),
            inspection_hours: getVal(auctionData, ['inspection_hours', 'return_window']),

            // Bids Array
            bids: bidsData
          };

          // Fallbacks
          if (!state.data.current_bid) state.data.current_bid = state.data.starting_price;
          if (!state.data.auction_id) state.data.auction_id = state.auctionId;

          if (typeof state.data.is_watched !== 'undefined') {
            state.isWatched = state.data.is_watched;
          }

          render();
          startTicker();

          ApiClient.post(`/auctions/${state.auctionId}/view`).catch(() => { });

          if (!state.sse && window.LiveAuctionStream) {
            state.sse = new LiveAuctionStream(state.auctionId, {
              onBid: handleLiveBid,
              onStatus: handleStatusChange,
            });
          }
        } catch (err) {
          console.error('[auction] load failed:', err);
          renderError(err && err.message ? err.message : 'Could not load this auction.');
        }
      }

      function renderError(msg) {
        els.root.innerHTML = `
          <div class="max-w-md mx-auto px-4 py-20 text-center">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-500/10 flex items-center justify-center mb-5">
              <i class="fa-solid fa-triangle-exclamation text-2xl text-rose-500"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-900 dark:text-slate-100 mb-2">Couldn't open this auction</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">${escapeHtml(msg)}</p>
            <a href="/auctions.html" class="inline-flex items-center gap-2 px-5 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold transition-colors">
              <i class="fa-solid fa-arrow-left text-xs"></i><span>Back to auctions</span>
            </a>
          </div>
        `;
      }

      function render() {
        const a = state.data;
        const cd = (window.UI && UI.formatCountdown) ? UI.formatCountdown(a.end_time) : { text: '—', ended: false, isUrgent: false };
        const cdText = cleanCountdown(cd.text);
        const isUrgent = cd.isUrgent && !cd.ended;

        const title = escapeHtml(a.title);
        const desc = escapeHtml(a.description);
        const sellerName = escapeHtml(a.seller_name);
        const sellerInitial = initial(a.seller_name);
        const category = escapeHtml(a.category_name || 'General');
        const location = a.location_city ? escapeHtml(a.location_city) : null;
        const condition = a.condition ? escapeHtml(String(a.condition)) : null;

        const currentPrice = a.current_bid;
        const increment = Math.max(1, a.bid_increment);
        const minNextBid = currentPrice + increment;
        const bidCount = a.bid_count;

        // Parse images safely
        let rawImages = [];
        if (Array.isArray(a.images) && a.images.length > 0) {
          rawImages = a.images.map(img => getImageUrl(img)).filter(Boolean);
        } else if (a.image) {
          rawImages = [getImageUrl(a.image)];
        }
        const images = rawImages.length > 0 ? rawImages : [getImageUrl(null)];

        if (els.mobileBar) {
          els.mobileBar.classList.remove('hidden');
          if (els.mobileBidValue) els.mobileBidValue.textContent = fmtMoney(currentPrice);
          if (els.mobileTime) els.mobileTime.textContent = cd.ended ? 'Ended' : cdText;
        }

        els.root.innerHTML = `

      function anonymizeName(name) {
        const s = String(name || '').trim();
        if (!s) return 'Bidder';
        if (s.length === 1) return s + '*';
        if (s.length === 2) return s[0] + '*';
        return s[0] + '***' + s[s.length - 1];
      }

      function renderBidList(bids) {
        if (!Array.isArray(bids) || bids.length === 0) {
          return `<p class="text-center text-slate-500 dark:text-slate-400 py-6 text-xs">No bids yet. Be the first to bid — place yours in the panel above.</p>`;
        }
        return bids.map((b, idx) => {
          const isTop = idx === 0;
          const amount = parseAmount(b.bid_amount || b.amount || 0);
          const timeAgo = fmtTime(b.bid_time || b.created_at || Date.now());

          return `
            <div class="flex items-center justify-between p-3 rounded-xl transition ${isTop ? 'bg-indigo-500/8 dark:bg-indigo-500/10 border border-indigo-500/25' : 'bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-800/60'}">
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-7 h-7 rounded-full ${isTop ? 'bg-indigo-500 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300'} flex items-center justify-center font-black text-[10px] shrink-0">
                  ${isTop ? '<i class="fa-solid fa-crown text-[10px]"></i>' : '#' + (idx + 1)}
                </div>
                <div class="min-w-0">
                  <p class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">${escapeHtml(anonymizeName(b.bidder_name || b.user_name))}</p>
                  <p class="text-[10px] text-slate-500 dark:text-slate-400">${escapeHtml(timeAgo)}</p>
                </div>
              </div>
              <span class="text-sm font-black tabular-nums shrink-0 ml-3 ${isTop ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-700 dark:text-slate-300'}">
                ${fmtMoney(amount)}
              </span>
            </div>
          `;
        }).join('');
      }

      function wireDynamicListeners() {
        els.root.querySelectorAll('.nb-thumb').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-img-index'), 10) || 0;
            const images = Array.isArray(state.data.images) && state.data.images.length ? state.data.images.map(i => getImageUrl(i)) : [getImageUrl(state.data.image)];
            const main = document.getElementById('main-image');
            if (main && images[idx]) main.src = images[idx];
            els.root.querySelectorAll('.nb-thumb').forEach((b, i) => {
              b.classList.toggle('active', i === idx);
              b.setAttribute('aria-selected', String(i === idx));
            });
          });
        });

        const wBtn = document.getElementById('btn-watchlist');
        if (wBtn) wBtn.addEventListener('click', toggleWatchlist);

        els.root.querySelectorAll('.quick-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            const val = chip.getAttribute('data-quick');
            const input = document.getElementById('input-bid-amount');
            if (input) {
              input.value = Number(val).toLocaleString('en-PK');
              input.focus();
              input.select();
            }
          });
        });

        const bidInput = document.getElementById('input-bid-amount');
        if (bidInput) bidInput.addEventListener('input', () => formatNumberInput(bidInput));

        const autoInput = document.getElementById('input-autobid-ceiling');
        if (autoInput) autoInput.addEventListener('input', () => formatNumberInput(autoInput));

        const form = document.getElementById('bid-form');
        if (form) form.addEventListener('submit', (e) => { e.preventDefault(); submitBid(); });

        const abBtn = document.getElementById('btn-autobid');
        if (abBtn) abBtn.addEventListener('click', submitAutoBid);

        const bnBtn = document.getElementById('btn-buy-now');
        if (bnBtn) bnBtn.addEventListener('click', buyNow);
      }

      function scrollToBidBox() {
        const el = document.getElementById('bidding-panel');
        if (!el) return;
        const y = el.getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({ top: y, behavior: 'smooth' });
        setTimeout(() => {
          const input = document.getElementById('input-bid-amount');
          if (input) input.focus();
        }, 400);
      }

      function startTicker() {
        if (state.ticker) clearInterval(state.ticker);
        if (!window.UI || typeof UI.formatCountdown !== 'function') return;

        state.ticker = setInterval(() => {
          if (!state.data) return;
          const cd = UI.formatCountdown(state.data.end_time);
          const cleaned = cleanCountdown(cd.text);
          const t1 = document.getElementById('countdown-text');
          if (t1) t1.textContent = cd.ended ? 'Ended' : cleaned + ' left';
          if (els.mobileTime) els.mobileTime.textContent = cd.ended ? 'Ended' : cleaned;
        }, 1000);
      }

      function requireAuth(redirectBack = true) {
        if (ApiClient.isAuthenticated()) return true;
        const back = redirectBack ? encodeURIComponent(window.location.pathname + window.location.search) : '';
        window.location.href = `/login.html${back ? '?redirect=' + back : ''}`;
        return false;
      }

      async function submitBid() {
        if (state.submitting) return;
        if (!requireAuth()) return;

        const input = document.getElementById('input-bid-amount');
        if (!input) return;
        const amount = parseFormattedNumber(input.value);

        const a = state.data;
        const currentPrice = a.current_bid;
        const increment = a.bid_increment;
        const minNextBid = currentPrice + increment;

        if (!amount || amount < minNextBid) {
          toast(`Your bid must be at least ${fmtMoney(minNextBid)}`, 'error');
          input.focus();
          return;
        }

        const ok = await confirmDialog({
          title: 'Place this bid?',
          message: `You're bidding ${fmtMoney(amount)}. If you win, you're committed to pay. Funds will be held in escrow until delivery is confirmed.`,
          confirmText: 'Yes, place bid',
          type: 'primary',
        });
        if (!ok) return;

        state.submitting = true;
        const btn = document.getElementById('btn-place-bid');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span class="hidden sm:inline">Placing…</span>'; }

        try {
          const res = await ApiClient.post(`/auctions/${state.auctionId}/bid`, { bid_amount: amount });
          toast((res && res.message) || `Bid placed at ${fmtMoney(amount)}`, 'success');
          await loadAuction();
        } catch (err) {
          toast((err && err.message) || 'Could not place bid. Please try again.', 'error');
        } finally {
          state.submitting = false;
          if (btn) { btn.disabled = false; btn.innerHTML = 'Place bid'; }
        }
      }

      async function submitAutoBid() {
        if (!requireAuth()) return;

        const input = document.getElementById('input-autobid-ceiling');
        if (!input) return;
        const maxAmount = parseFormattedNumber(input.value);

        const a = state.data;
        const currentPrice = a.current_bid;
        const increment = a.bid_increment;
        const minNextBid = currentPrice + increment;

        if (!maxAmount || maxAmount < minNextBid) {
          toast(`Your ceiling must be at least ${fmtMoney(minNextBid)}`, 'error');
          input.focus();
          return;
        }

        const ok = await confirmDialog({
          title: 'Activate auto-bid?',
          message: `We'll automatically bid the smallest needed amount on your behalf, up to a maximum of ${fmtMoney(maxAmount)}. You can change or cancel this anytime.`,
          confirmText: 'Activate auto-bid',
          type: 'primary',
        });
        if (!ok) return;

        const btn = document.getElementById('btn-autobid');
        if (btn) { btn.disabled = true; btn.textContent = '…'; }

        try {
          await ApiClient.post(`/auctions/${state.auctionId}/auto-bid`, { max_amount: maxAmount });
          toast(`Auto-bid set up to ${fmtMoney(maxAmount)}`, 'success');
          input.value = '';
        } catch (err) {
          toast((err && err.message) || 'Could not activate auto-bid', 'error');
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = 'Set'; }
        }
      }

      async function buyNow() {
        if (!requireAuth()) return;
        const a = state.data;
        const price = a.buy_now_price;

        const ok = await confirmDialog({
          title: 'Buy this now?',
          message: `You'll skip the auction and purchase for ${fmtMoney(price)}. Payment goes into escrow immediately. Auction ends.`,
          confirmText: 'Buy now',
          type: 'warning',
        });
        if (!ok) return;

        try {
          const res = await ApiClient.post(`/auctions/${state.auctionId}/buy-now`);
          const orderId = res && res.data && res.data.order_id;
          toast('Purchase confirmed. Redirecting to checkout…', 'success');
          setTimeout(() => {
            window.location.href = `/checkout.html${orderId ? '?order_id=' + encodeURIComponent(orderId) : ''}`;
          }, 900);
        } catch (err) {
          toast((err && err.message) || 'Could not complete purchase', 'error');
        }
      }

      async function toggleWatchlist() {
        if (!requireAuth()) return;
        try {
          if (state.isWatched) {
            await ApiClient.delete(`/watchlist/${state.auctionId}`);
            state.isWatched = false;
            toast('Removed from watchlist', 'info');
          } else {
            await ApiClient.post(`/watchlist/${state.auctionId}`);
            state.isWatched = true;
            toast('Added to watchlist', 'success');
          }
          updateWatchlistUI();
        } catch (err) {
          toast((err && err.message) || 'Could not update watchlist', 'error');
        }
      }

      function updateWatchlistUI() {
        const btn = document.getElementById('btn-watchlist');
        if (!btn) return;
        const icon = btn.querySelector('i');
        const label = btn.querySelector('span');
        if (icon) icon.className = state.isWatched ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart';
        if (label) label.textContent = state.isWatched ? 'Saved' : 'Watch';
      }

      function handleLiveBid(ev) {
        const amt = parseAmount(ev && (ev.bid_amount || ev.amount));
        toast(`New bid: ${fmtMoney(amt)}`, 'info');
        const card = document.getElementById('live-bid-card');
        if (card) {
          card.classList.add('nb-bid-flash');
          setTimeout(() => card.classList.remove('nb-bid-flash'), 1200);
        }
        loadAuction();
      }

      function handleStatusChange(ev) {
        const status = ev && ev.status ? String(ev.status) : 'updated';
        toast(`Auction ${status}`, 'warning');
        loadAuction();
      }

      window.addEventListener('beforeunload', () => {
        if (state.sse && typeof state.sse.close === 'function') state.sse.close();
        if (state.ticker) clearInterval(state.ticker);
      });

      document.addEventListener('DOMContentLoaded', init);
    })();


  </script>
</body>

</html>
