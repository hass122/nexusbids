<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamper-Resistant Audit Trail — NexusBids Admin</title>
  <script>(function () { var t = localStorage.getItem('nexusbids_theme') || 'system'; var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.classList.toggle('dark', d); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); })();</script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } };</script>
  <script src="https://cdn.tailwindcss.com?plugins=forms" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <style>
    :root {
      --a-bg: #f4f6fb;
      --a-surface: #fff;
      --a-surface-2: #f7f9fc;
      --a-surface-3: #eceff6;
      --a-border: #e3e8f0;
      --a-text: #0f172a;
      --a-text-muted: #565650;
      --a-text-light: #6e6e68
    }

    html.dark {
      --a-bg: #05070f;
      --a-surface: #0d1220;
      --a-surface-2: #121a2b;
      --a-surface-3: #1a2336;
      --a-border: #1e2a40;
      --a-text: #eef2f9;
      --a-text-muted: #b8b8b0;
      --a-text-light: #8f8f88
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      background: var(--a-bg);
      color: var(--a-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    .panel {
      background: var(--a-surface);
      border: 1px solid var(--a-border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15)
    }

    .panel.p-0 {
      padding: 0
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: .78rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      font-family: inherit
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem
    }

    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--a-text-muted);
      border-bottom: 1px solid var(--a-border)
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--a-border);
      vertical-align: middle
    }

    .data-table tr:hover td {
      background: var(--a-surface-2)
    }
  </style>
</head>

<body class="min-h-screen flex flex-col font-sans">
  <header id="nb-header" style="min-height:64px;contain:layout"></header>
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div id="admin-subnav" style="min-height:52px;contain:layout"></div>

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold text-brand-400 bg-brand-500/10 border border-brand-500/20 mb-2">
          <i class="fa-solid fa-clipboard-list"></i> Tamper-Resistant Journal
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-[var(--a-text)]">Admin Activity Logs</h1>
        <p class="text-xs sm:text-sm text-[var(--a-text-muted)] mt-1">Immutable record of every administrative action.
        </p>
      </div>
      <button onclick="loadLogs()" class="btn btn-primary text-xs"><i class="fa-solid fa-rotate-right"></i>
        Refresh</button>
    </div>

    <div class="panel p-0 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Log ID</th>
              <th>Administrator</th>
              <th>Action Executed</th>
              <th>Target</th>
              <th>IP</th>
              <th>Timestamp</th>
              <th>Meta</th>
            </tr>
          </thead>
          <tbody id="logs-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer id="nb-footer"></footer>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin-nav.js" defer></script>
  <script>
    function aEsc(s) {
      if (window.UI && UI.escapeHtml) return UI.escapeHtml(s);
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadLogs() {
      const tbody = document.getElementById('logs-table-body');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-[var(--a-text-muted)]"><i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i><br>Reading audit trail…</td></tr>';

      try {
        const res = await ApiClient.get('/admin/activity-logs');
        const logs = (res && res.data) || [];

        if (!logs.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-[var(--a-text-muted)]">No audit activity logged yet.</td></tr>';
          return;
        }

        tbody.innerHTML = logs.map(l => {
          // ✅ FIXED: escape action instead of raw
          const action = String(l.action_type || l.action || 'ADMIN_ACTION');
          const target = l.target_type ? (l.target_type + ' #' + (l.target_id || '')) : (l.activity || 'system');
          const metaRaw = typeof l.meta === 'object' ? JSON.stringify(l.meta) : (l.details || '');
          const created = new Date(l.created_at);
          const timeStr = isNaN(created.getTime()) ? '—' : created.toLocaleString('en-PK');

          return `
            <tr>
              <td class="font-mono text-xs font-bold text-slate-400">#${aEsc(l.id)}</td>
              <td><div class="text-xs"><strong class="text-[var(--a-text)] block font-bold">${aEsc(l.admin_name || ('Admin #' + l.admin_id))}</strong><span class="text-[10px] text-[var(--a-text-muted)]">${aEsc(l.admin_email || '')}</span></div></td>
              <td><span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase font-mono bg-brand-500/10 text-brand-400 border border-brand-500/20">${aEsc(action)}</span></td>
              <td><span class="text-xs font-bold text-[var(--a-text)]">${aEsc(target)}</span></td>
              <td><span class="font-mono text-xs text-[var(--a-text-muted)]">${aEsc(l.ip_address || '127.0.0.1')}</span></td>
              <td><span class="text-xs text-[var(--a-text-muted)]">${timeStr}</span></td>
              <td><span class="font-mono text-[11px] text-[var(--a-text-muted)]" style="display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:20rem" title="${aEsc(metaRaw)}">${aEsc(metaRaw || 'OK')}</span></td>
            </tr>`;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-rose-400">' + aEsc(err.message || 'Error loading audit logs.') + '</td></tr>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const role = ApiClient.getUserRole && ApiClient.getUserRole();
      if (!ApiClient.isAuthenticated() || role !== 'admin') {
        window.location.href = '/login.html?redirect=/admin/activity-logs.html';
        return;
      }
      loadLogs();
    });
  </script>
  <script src="/assets/js/ai-chat.js" defer></script>
</body>

</html>
