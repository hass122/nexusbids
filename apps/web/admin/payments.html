<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Transactions — NexusBids Admin</title>
  <script>(function () { var t = localStorage.getItem('nexusbids_theme') || 'system'; var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.classList.toggle('dark', d); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); })();</script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } };</script>
  <script src="https://cdn.tailwindcss.com?plugins=forms" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <style>
    :root {
      --a-bg: #f4f6fb;
      --a-surface: #fff;
      --a-surface-2: #f7f9fc;
      --a-surface-3: #eceff6;
      --a-border: #e3e8f0;
      --a-text: #0f172a;
      --a-text-muted: #565650;
      --a-text-light: #6e6e68;
      --a-brand: #6366f1;
      --a-brand-soft: rgba(99, 102, 241, .10);
      --a-brand-ring: rgba(99, 102, 241, .22);
      --a-ok: #059669;
      --a-ok-soft: rgba(16, 185, 129, .10);
      --a-warn: #b45309;
      --a-warn-soft: rgba(245, 158, 11, .12);
      --a-danger: #e11d48;
      --a-danger-soft: rgba(244, 63, 94, .10);
      --a-info: #2563eb;
      --a-info-soft: rgba(59, 130, 246, .10);
      --a-skel: linear-gradient(90deg, #eef1f7 25%, #e3e8f2 37%, #eef1f7 63%)
    }

    html.dark {
      --a-bg: #05070f;
      --a-surface: #0d1220;
      --a-surface-2: #121a2b;
      --a-surface-3: #1a2336;
      --a-border: #1e2a40;
      --a-text: #eef2f9;
      --a-text-muted: #b8b8b0;
      --a-text-light: #8f8f88;
      --a-brand: #818cf8;
      --a-brand-soft: rgba(99, 102, 241, .14);
      --a-brand-ring: rgba(99, 102, 241, .30);
      --a-ok: #34d399;
      --a-ok-soft: rgba(16, 185, 129, .14);
      --a-warn: #fbbf24;
      --a-warn-soft: rgba(245, 158, 11, .14);
      --a-danger: #fb7185;
      --a-danger-soft: rgba(244, 63, 94, .14);
      --a-info: #60a5fa;
      --a-info-soft: rgba(59, 130, 246, .14);
      --a-skel: linear-gradient(90deg, #121a2b 25%, #1b2437 37%, #121a2b 63%)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      -webkit-tap-highlight-color: transparent
    }

    body {
      background: var(--a-bg);
      color: var(--a-text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden
    }

    .page-main {
      flex: 1;
      width: 100%;
      max-width: 84rem;
      margin: 0 auto;
      padding: 20px 16px 40px
    }

    @media (min-width:640px) {
      .page-main {
        padding: 28px 24px 48px
      }
    }

    @media (min-width:1024px) {
      .page-main {
        padding: 32px 32px 56px
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--a-brand);
      background: var(--a-brand-soft);
      border: 1px solid var(--a-brand-ring);
      padding: 5px 11px;
      border-radius: 999px
    }

    .page-title {
      font-size: clamp(1.4rem, 3.8vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -.024em;
      line-height: 1.15;
      margin: 12px 0 6px
    }

    .page-sub {
      font-size: .85rem;
      color: var(--a-text-muted);
      line-height: 1.55;
      max-width: 62ch
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px
    }

    @media (min-width:640px) {
      .stat-grid {
        gap: 14px
      }
    }

    .stat-card {
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--a-surface);
      border: 1px solid var(--a-border);
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .stat-label {
      font-size: .64rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--a-text-light);
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.1
    }

    .stat-value.is-ok {
      color: var(--a-ok)
    }

    .stat-value.is-warn {
      color: var(--a-warn)
    }

    .stat-value.is-brand {
      color: var(--a-brand)
    }

    .stat-value.is-danger {
      color: var(--a-danger)
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px
    }

    .tabs {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      background: var(--a-surface-3);
      border: 1px solid var(--a-border);
      border-radius: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      max-width: 100%
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      border: 0;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 9px;
      font-family: inherit;
      font-size: .74rem;
      font-weight: 700;
      color: var(--a-text-muted);
      white-space: nowrap;
      transition: all .2s
    }

    .tab:hover:not(.is-active) {
      color: var(--a-text)
    }

    .tab.is-active {
      background: var(--a-surface);
      color: var(--a-text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .06)
    }

    .tab .count {
      font-size: .62rem;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--a-surface-3);
      color: var(--a-text-light);
      font-variant-numeric: tabular-nums
    }

    .tab.is-active .count {
      background: var(--a-brand-soft);
      color: var(--a-brand)
    }

    .search-wrap {
      position: relative
    }

    .search-wrap i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .72rem;
      color: var(--a-text-light);
      pointer-events: none
    }

    .search-wrap input {
      width: 100%;
      min-width: 180px;
      max-width: 260px;
      height: 38px;
      padding: 0 12px 0 32px;
      background: var(--a-surface);
      border: 1px solid var(--a-border);
      border-radius: 10px;
      color: var(--a-text);
      font-family: inherit;
      font-size: .8rem;
      outline: none
    }

    .search-wrap input::placeholder {
      color: var(--a-text-light)
    }

    .search-wrap input:focus {
      border-color: var(--a-brand);
      box-shadow: 0 0 0 3px var(--a-brand-ring)
    }

    @media (max-width:640px) {
      .search-wrap input {
        max-width: none;
        width: 100%
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 11px;
      font-family: inherit;
      font-size: .78rem;
      font-weight: 700;
      line-height: 1;
      border: 1px solid transparent;
      text-decoration: none;
      cursor: pointer;
      min-height: 38px;
      white-space: nowrap
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .btn-ghost {
      background: var(--a-surface);
      border-color: var(--a-border);
      color: var(--a-text-muted)
    }

    .btn-ghost:hover {
      color: var(--a-text);
      border-color: var(--a-text-light)
    }

    .panel {
      background: var(--a-surface);
      border: 1px solid var(--a-border);
      border-radius: 18px;
      overflow: hidden
    }

    .panel-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--a-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap
    }

    .panel-title {
      font-size: .92rem;
      font-weight: 800;
      letter-spacing: -.005em
    }

    .panel-sub {
      font-size: .74rem;
      color: var(--a-text-light);
      margin-top: 2px;
      font-weight: 500
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .82rem;
      min-width: 900px
    }

    .data-table thead th {
      padding: 11px 14px;
      text-align: left;
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--a-text-light);
      background: var(--a-surface-2);
      border-bottom: 1px solid var(--a-border);
      white-space: nowrap
    }

    .data-table tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--a-border);
      vertical-align: middle
    }

    .data-table tbody tr:last-child td {
      border-bottom: none
    }

    .data-table tbody tr:hover td {
      background: var(--a-surface-2)
    }

    .txn-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .72rem;
      font-weight: 700;
      color: var(--a-brand);
      word-break: break-all;
      display: block
    }

    .txn-sub {
      font-size: .62rem;
      color: var(--a-text-light);
      margin-top: 2px
    }

    .cell-title {
      font-weight: 700;
      font-size: .82rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
      max-width: 220px
    }

    .cell-sub {
      font-size: .7rem;
      color: var(--a-text-muted);
      margin-top: 2px;
      line-height: 1.4;
      word-break: break-word;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .cell-amount {
      font-size: .92rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--a-ok);
      white-space: nowrap
    }

    .cell-amount.is-empty {
      color: var(--a-text-light);
      font-weight: 600
    }

    .cell-amount .rs {
      font-size: .68rem;
      font-weight: 700;
      color: var(--a-text-light);
      margin-right: 3px;
      letter-spacing: .04em
    }

    .cell-time {
      font-size: .72rem;
      color: var(--a-text-muted);
      white-space: nowrap
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      border: 1px solid transparent;
      white-space: nowrap
    }

    .badge i {
      font-size: .55rem
    }

    .badge-paid {
      background: var(--a-ok-soft);
      color: var(--a-ok);
      border-color: rgba(16, 185, 129, .30)
    }

    .badge-pending {
      background: var(--a-warn-soft);
      color: var(--a-warn);
      border-color: rgba(245, 158, 11, .30)
    }

    .badge-failed {
      background: var(--a-danger-soft);
      color: var(--a-danger);
      border-color: rgba(244, 63, 94, .28)
    }

    .badge-refunded {
      background: var(--a-info-soft);
      color: var(--a-info);
      border-color: rgba(59, 130, 246, .28)
    }

    .badge-neutral {
      background: var(--a-surface-3);
      color: var(--a-text-muted);
      border-color: var(--a-border)
    }

    .method-cell {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em
    }

    .method-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: .65rem;
      background: var(--a-surface-3);
      color: var(--a-text-muted);
      flex-shrink: 0
    }

    .empty {
      padding: 60px 20px;
      text-align: center
    }

    .empty-icon {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: var(--a-surface-2);
      border: 1px solid var(--a-border);
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      font-size: 1.35rem;
      color: var(--a-text-light)
    }

    .empty-title {
      font-size: .95rem;
      font-weight: 800;
      margin: 0 0 6px
    }

    .empty-text {
      font-size: .8rem;
      color: var(--a-text-muted);
      line-height: 1.55;
      max-width: 26rem;
      margin: 0 auto
    }

    .skeleton {
      background: var(--a-skel);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 8px
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    .spin {
      animation: spin .9s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @media (max-width:767px) {
      .data-table {
        min-width: 0
      }

      .data-table thead {
        display: none
      }

      .data-table,
      .data-table tbody,
      .data-table tr,
      .data-table td {
        display: block;
        width: 100%
      }

      .data-table tbody tr {
        padding: 14px 16px;
        border-bottom: 1px solid var(--a-border)
      }

      .data-table tbody td {
        padding: 4px 0;
        border: none
      }

      .data-table tbody td[data-label]::before {
        content: attr(data-label);
        display: block;
        font-size: .6rem;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--a-text-light);
        margin-bottom: 3px
      }

      .cell-title,
      .cell-sub {
        max-width: none;
        white-space: normal
      }
    }
  </style>
</head>

<body>
  <header id="nb-header" style="min-height:64px;contain:layout"></header>
  <main class="page-main">
    <div id="admin-subnav" style="min-height:52px;contain:layout"></div>

    <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-5 mb-6">
      <div>
        <span class="eyebrow"><i class="fa-solid fa-receipt"></i> Financial gateway</span>
        <h1 class="page-title">Payment transactions</h1>
        <p class="page-sub">Every payment hitting the platform — gateway, amount, settlement status. Sorted newest
          first.</p>
      </div>
      <button id="refresh-btn" type="button" class="btn btn-ghost">
        <i class="fa-solid fa-rotate-right" id="refresh-icon"></i>Refresh
      </button>
    </div>

    <div class="stat-grid" id="stats-grid">
      <div class="stat-card"><span class="stat-label"><i class="fa-solid fa-list"></i> Total</span><span
          class="stat-value" id="stat-total">—</span></div>
      <div class="stat-card"><span class="stat-label"><i class="fa-solid fa-circle-check"></i> Paid</span><span
          class="stat-value is-ok" id="stat-paid">—</span></div>
      <div class="stat-card"><span class="stat-label"><i class="fa-solid fa-hourglass-half"></i> Pending</span><span
          class="stat-value is-warn" id="stat-pending">—</span></div>
      <div class="stat-card"><span class="stat-label"><i class="fa-solid fa-coins"></i> Volume</span><span
          class="stat-value is-brand" id="stat-volume">—</span></div>
    </div>

    <div class="toolbar">
      <div class="flex flex-wrap gap-2 items-center" style="flex:1;min-width:0">
        <div class="tabs">
          <button class="tab is-active" data-filter="all" type="button">All <span class="count"
              id="cnt-all">0</span></button>
          <button class="tab" data-filter="paid" type="button">Paid <span class="count" id="cnt-paid">0</span></button>
          <button class="tab" data-filter="pending" type="button">Pending <span class="count"
              id="cnt-pending">0</span></button>
          <button class="tab" data-filter="failed" type="button">Failed <span class="count"
              id="cnt-failed">0</span></button>
          <button class="tab" data-filter="refunded" type="button">Refunded <span class="count"
              id="cnt-refunded">0</span></button>
        </div>
      </div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search-input" type="search" placeholder="Search by txn, user, item…" autocomplete="off">
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Ledger</div>
          <div class="panel-sub" id="ledger-sub">Loading transactions…</div>
        </div>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Txn ID</th>
              <th>Buyer / Seller</th>
              <th>Order</th>
              <th>Amount</th>
              <th>Gateway</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="payments-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer id="nb-footer"></footer>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin-nav.js" defer></script>
  <script>
    (function () {
      'use strict';
      var state = { payments: [], filter: 'all', search: '' };
      var $ = id => document.getElementById(id);

      function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function fmtPKR(v) {
        var n = Number(v);
        if (!isFinite(n)) return '—';
        if (window.UI && typeof UI.formatPKR === 'function') return UI.formatPKR(n);
        return 'Rs. ' + n.toLocaleString('en-PK');
      }
      function fmtDateTime(d) {
        if (!d) return '—';
        var dt = new Date(d);
        if (isNaN(dt.getTime())) return '—';
        return dt.toLocaleString('en-PK', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      }
      function fmtMethod(method) {
        if (!method) return { label: 'Gateway', icon: 'fa-credit-card' };
        var m = String(method).toLowerCase();
        if (m.includes('jazz')) return { label: 'JazzCash', icon: 'fa-mobile-screen' };
        if (m.includes('easy')) return { label: 'Easypaisa', icon: 'fa-mobile-screen' };
        if (m.includes('bank')) return { label: 'Bank', icon: 'fa-building-columns' };
        if (m.includes('naya')) return { label: 'NayaPay', icon: 'fa-wallet' };
        if (m.includes('sada')) return { label: 'SadaPay', icon: 'fa-wallet' };
        return { label: method, icon: 'fa-credit-card' };
      }
      function extractAmount(p) {
        var candidates = [p.amount, p.total_amount, p.transaction_amount, p.paid_amount, p.order_amount, p.winning_bid, p.payment_amount, p.order_total];
        for (var i = 0; i < candidates.length; i++) {
          var n = Number(candidates[i]);
          if (isFinite(n) && n > 0) return n;
        }
        return null;
      }
      function extractTxnId(p) {
        var candidates = [p.transaction_id, p.transaction_reference, p.external_transaction_id, p.txn_id, p.gateway_reference, p.reference, p.order_number];
        for (var i = 0; i < candidates.length; i++) {
          var v = candidates[i];
          if (v && String(v).trim()) return String(v).trim();
        }
        if (p.order_id) return 'ORD-' + p.order_id;
        if (p.payment_id) return 'PAY-' + p.payment_id;
        return null;
      }
      function normalizeStatus(s) {
        var v = String(s || 'unpaid').toLowerCase();
        if (v === 'paid' || v === 'completed' || v === 'success' || v === 'succeeded') return 'paid';
        if (v === 'pending' || v === 'initiated' || v === 'processing' || v === 'receipt_uploaded') return 'pending';
        if (v === 'failed' || v === 'cancelled' || v === 'canceled' || v === 'rejected') return 'failed';
        if (v === 'refunded') return 'refunded';
        return 'pending';
      }
      function badgeFor(status) {
        var s = normalizeStatus(status);
        var map = {
          paid: ['badge-paid', 'fa-circle-check', 'Paid'],
          pending: ['badge-pending', 'fa-hourglass-half', 'Pending'],
          failed: ['badge-failed', 'fa-circle-xmark', 'Failed'],
          refunded: ['badge-refunded', 'fa-rotate-left', 'Refunded']
        };
        var e = map[s] || ['badge-neutral', 'fa-circle-info', s];
        return '<span class="badge ' + e[0] + '"><i class="fa-solid ' + e[1] + '"></i>' + e[2] + '</span>';
      }
      function getFilteredPayments() {
        var list = state.payments.slice();
        if (state.search) {
          var q = state.search.toLowerCase();
          list = list.filter(p => {
            var haystack = [p.transaction_id, p.transaction_reference, p.external_transaction_id, p.order_number, p.order_id, p.user_name, p.buyer_name, p.seller_name, p.user_email, p.buyer_email, p.auction_title].map(v => String(v || '').toLowerCase()).join(' ');
            return haystack.indexOf(q) !== -1;
          });
        }
        if (state.filter !== 'all') list = list.filter(p => normalizeStatus(p.payment_status) === state.filter);
        return list;
      }
      function renderRow(p) {
        var amount = extractAmount(p);
        var amountHtml = amount != null ? '<span class="rs">PKR</span>' + amount.toLocaleString('en-PK') : '—';
        var method = fmtMethod(p.payment_method || p.payment_type);
        var txnId = extractTxnId(p) || '—';
        var buyerName = p.buyer_name || p.user_name || 'Unknown buyer';
        var sellerName = p.seller_name || '';
        var buyerEmail = p.buyer_email || p.user_email || '';
        var orderLabel = p.auction_title || p.order_number || ('Order #' + (p.order_id || '—'));
        var orderSub = p.order_number && p.auction_title ? p.order_number : (p.order_id ? '#' + p.order_id : '');

        return '<tr>' +
          '<td data-label="Txn ID"><span class="txn-id">' + escapeHtml(txnId) + '</span>' + (p.order_id ? '<div class="txn-sub">Order #' + escapeHtml(p.order_id) + '</div>' : '') + '</td>' +
          '<td data-label="Buyer / Seller"><div class="cell-title">' + escapeHtml(buyerName) + '</div>' + (buyerEmail ? '<div class="cell-sub">' + escapeHtml(buyerEmail) + '</div>' : (sellerName ? '<div class="cell-sub">Seller: ' + escapeHtml(sellerName) + '</div>' : '')) + '</td>' +
          '<td data-label="Order"><div class="cell-title">' + escapeHtml(orderLabel) + '</div>' + (orderSub ? '<div class="cell-sub">' + escapeHtml(orderSub) + '</div>' : '') + '</td>' +
          '<td data-label="Amount"><span class="cell-amount' + (amount == null ? ' is-empty' : '') + '">' + amountHtml + '</span></td>' +
          '<td data-label="Gateway"><span class="method-cell"><span class="method-icon"><i class="fa-solid ' + method.icon + '"></i></span>' + escapeHtml(method.label) + '</span></td>' +
          '<td data-label="Status">' + badgeFor(p.payment_status) + '</td>' +
          '<td data-label="Created"><span class="cell-time">' + fmtDateTime(p.created_at) + '</span></td>' +
          '</tr>';
      }
      function render() {
        var tbody = $('payments-table-body'); if (!tbody) return;
        var list = getFilteredPayments();
        var sub = $('ledger-sub');
        if (sub) {
          var total = state.payments.length, shown = list.length;
          sub.textContent = shown === total ? total + (total === 1 ? ' transaction' : ' transactions') : shown + ' of ' + total + ' shown';
        }
        if (!list.length) {
          var isFiltered = state.filter !== 'all' || state.search;
          tbody.innerHTML = '<tr><td colspan="7"><div class="empty"><div class="empty-icon"><i class="fa-solid ' + (isFiltered ? 'fa-filter' : 'fa-receipt') + '"></i></div><p class="empty-title">' + (isFiltered ? 'Nothing matches' : 'No payments yet') + '</p><p class="empty-text">' + (isFiltered ? 'Try a different tab or clear the search.' : 'Payments will appear here once buyers start paying.') + '</p></div></td></tr>';
          return;
        }
        tbody.innerHTML = list.map(renderRow).join('');
      }
      function computeStats() {
        var total = state.payments.length, paid = 0, pending = 0, failed = 0, refunded = 0, volume = 0;
        state.payments.forEach(p => {
          var s = normalizeStatus(p.payment_status);
          if (s === 'paid') { paid++; var a = extractAmount(p); if (a != null) volume += a; }
          else if (s === 'pending') pending++;
          else if (s === 'failed') failed++;
          else if (s === 'refunded') refunded++;
        });
        $('stat-total').textContent = total;
        $('stat-paid').textContent = paid;
        $('stat-pending').textContent = pending;
        $('stat-volume').textContent = volume > 0 ? (volume >= 1000000 ? 'Rs. ' + (volume / 1000000).toFixed(2) + 'M' : 'Rs. ' + volume.toLocaleString('en-PK')) : '—';
        $('cnt-all').textContent = total;
        $('cnt-paid').textContent = paid;
        $('cnt-pending').textContent = pending;
        $('cnt-failed').textContent = failed;
        $('cnt-refunded').textContent = refunded;
      }
      function renderSkeletons(n) {
        return Array(n).fill(0).map(() => '<tr><td><div class="skeleton" style="height:14px;width:110px"></div><div class="skeleton" style="height:10px;width:50px;margin-top:6px"></div></td><td><div class="skeleton" style="height:14px;width:120px"></div><div class="skeleton" style="height:10px;width:150px;margin-top:6px"></div></td><td><div class="skeleton" style="height:14px;width:180px"></div></td><td><div class="skeleton" style="height:16px;width:80px"></div></td><td><div class="skeleton" style="height:22px;width:100px;border-radius:999px"></div></td><td><div class="skeleton" style="height:22px;width:80px;border-radius:999px"></div></td><td><div class="skeleton" style="height:14px;width:120px"></div></td></tr>').join('');
      }
      async function loadPayments() {
        var tbody = $('payments-table-body'); if (!tbody) return;
        tbody.innerHTML = renderSkeletons(5);
        try {
          var res = await ApiClient.get('/admin/payments');
          var payments = (res && Array.isArray(res.data)) ? res.data : [];
          payments.sort((a, b) => (new Date(b.created_at).getTime() || 0) - (new Date(a.created_at).getTime() || 0));
          state.payments = payments;
          computeStats();
          render();
        } catch (err) {
          console.error('[payments]', err);
          tbody.innerHTML = '<tr><td colspan="7"><div class="empty"><div class="empty-icon" style="color:var(--a-danger);background:var(--a-danger-soft);border-color:transparent"><i class="fa-solid fa-triangle-exclamation"></i></div><p class="empty-title">Couldn\'t load payments</p><p class="empty-text">' + escapeHtml((err && err.message) || 'Please try again.') + '</p></div></td></tr>';
          var sub = $('ledger-sub'); if (sub) sub.textContent = 'Failed to load';
        }
      }
      function initTabs() {
        document.querySelectorAll('.tab[data-filter]').forEach(tab => {
          tab.addEventListener('click', () => {
            var f = tab.dataset.filter;
            if (f === state.filter) return;
            state.filter = f;
            var s = $('search-input'); if (s && s.value) { s.value = ''; state.search = ''; }
            document.querySelectorAll('.tab[data-filter]').forEach(t => t.classList.toggle('is-active', t === tab));
            render();
          });
        });
      }
      function initSearch() {
        var el = $('search-input'); if (!el) return;
        var t;
        el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { state.search = el.value.trim(); render(); }, 180); });
      }
      function initRefresh() {
        var btn = $('refresh-btn'), icon = $('refresh-icon');
        if (!btn) return;
        btn.addEventListener('click', async () => {
          if (btn.disabled) return;
          btn.disabled = true;
          if (icon) icon.classList.add('spin');
          try { await loadPayments(); }
          finally { if (icon) icon.classList.remove('spin'); btn.disabled = false; }
        });
      }
      document.addEventListener('DOMContentLoaded', () => {
        const role = ApiClient.getUserRole && ApiClient.getUserRole();
        if (!ApiClient.isAuthenticated() || role !== 'admin') {
          window.location.href = '/login.html?redirect=/admin/payments.html';
          return;
        }
        initTabs(); initSearch(); initRefresh(); loadPayments();
      });
    })();
  </script>
  <script src="/assets/js/ai-chat.js" defer></script>
</body>
