<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Alerts — NexusBids Admin</title>
  <script>(function () { var t = localStorage.getItem('nexusbids_theme') || 'system'; var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.classList.toggle('dark', d); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); })();</script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } };</script>
  <script src="https://cdn.tailwindcss.com?plugins=forms" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <style>
    :root {
      --a-bg: #f4f6fb;
      --a-surface: #fff;
      --a-surface-2: #f7f9fc;
      --a-surface-3: #eceff6;
      --a-border: #e3e8f0;
      --a-text: #0f172a;
      --a-text-muted: #565650;
      --a-text-light: #6e6e68
    }

    html.dark {
      --a-bg: #05070f;
      --a-surface: #0d1220;
      --a-surface-2: #121a2b;
      --a-surface-3: #1a2336;
      --a-border: #1e2a40;
      --a-text: #eef2f9;
      --a-text-muted: #b8b8b0;
      --a-text-light: #8f8f88
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      background: var(--a-bg);
      color: var(--a-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    .panel {
      background: var(--a-surface);
      border: 1px solid var(--a-border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15)
    }

    .panel.p-0 {
      padding: 0
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: .78rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      font-family: inherit
    }

    .btn-emerald {
      background: rgba(16, 185, 129, .15);
      border-color: rgba(16, 185, 129, .3);
      color: #34d399
    }

    .btn-emerald:hover {
      background: rgba(16, 185, 129, .25)
    }

    .btn-danger {
      background: rgba(239, 68, 68, .12);
      border-color: rgba(239, 68, 68, .3);
      color: #f87171
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, .25)
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .03em;
      text-transform: uppercase
    }

    .risk-high {
      background: rgba(239, 68, 68, .18);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, .35)
    }

    .risk-med {
      background: rgba(245, 158, 11, .18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, .35)
    }

    .risk-low {
      background: rgba(16, 185, 129, .18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, .35)
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem
    }

    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--a-text-muted);
      border-bottom: 1px solid var(--a-border)
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--a-border);
      vertical-align: middle
    }

    .data-table tr:hover td {
      background: var(--a-surface-2)
    }
  </style>
</head>

<body class="min-h-screen flex flex-col font-sans">
  <header id="nb-header" style="min-height:64px;contain:layout"></header>
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div id="admin-subnav" style="min-height:52px;contain:layout"></div>

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold text-rose-400 bg-rose-500/10 border border-rose-500/20 mb-2">
          <i class="fa-solid fa-triangle-exclamation"></i> Fraud Intelligence
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-[var(--a-text)]">Fraud &amp; Shill Bidding Alerts</h1>
        <p class="text-xs sm:text-sm text-[var(--a-text-muted)] mt-1">AI-flagged price inflation, coordinated bidder
          rings, and seller self-bidding.</p>
      </div>
      <button onclick="loadFraudAlerts()" class="btn btn-emerald text-xs"><i class="fa-solid fa-rotate-right"></i>
        Refresh</button>
    </div>

    <div class="panel p-0 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Risk</th>
              <th>Alert Type</th>
              <th>Target</th>
              <th>Seller</th>
              <th>Flagged Bidder</th>
              <th>AI Analysis</th>
              <th>Status</th>
              <th class="text-right">Action</th>
            </tr>
          </thead>
          <tbody id="fraud-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer id="nb-footer"></footer>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin-nav.js" defer></script>
  <script>
    function fEsc(s) {
      if (window.UI && UI.escapeHtml) return UI.escapeHtml(s);
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function fToast(msg, type) {
      if (window.UI && UI.showToast) UI.showToast(msg, type);
      else console.log(type, msg);
    }

    async function loadFraudAlerts() {
      const tbody = document.getElementById('fraud-table-body');
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-12 text-[var(--a-text-muted)]"><i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i><br>Scanning for fraud anomalies…</td></tr>';

      try {
        const res = await ApiClient.get('/admin/fraud-alerts');
        const alerts = (res && res.data) || [];

        if (!alerts.length) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-12 text-[var(--a-text-muted)]">No active fraud alerts. System is clean.</td></tr>';
          return;
        }

        tbody.innerHTML = alerts.map(f => {
          const scoreRaw = parseInt(f.risk_score || 0, 10);
          const score = isNaN(scoreRaw) ? 0 : Math.max(0, Math.min(100, scoreRaw));
          // ✅ FIXED: case-insensitive status check
          const status = String(f.status || '').toLowerCase();
          const isPending = status === 'new' || status === 'reviewing' || status === 'pending';
          const aid = String(f.alert_id);

          return `
            <tr>
              <td><span class="badge ${score >= 75 ? 'risk-high' : score >= 40 ? 'risk-med' : 'risk-low'} font-mono text-xs"><i class="fa-solid fa-shield-virus text-[10px]"></i> ${score}/100</span></td>
              <td><strong class="text-xs text-[var(--a-text)] block font-extrabold">Shill Bidding Suspected</strong><span class="text-[11px] text-[var(--a-text-muted)]">${fEsc(f.signals || 'Matching subnet / device footprint')}</span></td>
              <td><span class="text-xs font-bold text-[var(--a-text)] block" style="display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden">${fEsc(f.auction_title || ('Lot #' + f.auction_id))}</span><span class="text-[10px] text-[var(--a-text-muted)]">Lot #${fEsc(f.auction_id)}</span></td>
              <td><span class="text-xs text-[var(--a-text)]">${fEsc(f.seller_name || ('Seller #' + f.seller_id))}</span></td>
              <td><span class="text-xs font-bold text-rose-400">${fEsc(f.bidder_name || ('Bidder #' + (f.bidder_id || '—')))}</span></td>
              <td><p class="text-xs text-[var(--a-text-muted)] max-w-xs leading-snug" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${fEsc(f.ai_reason || 'Bidder IP and seller IP registered within identical ASN / co-location window.')}</p></td>
              <td><span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase ${isPending ? 'bg-amber-500/10 text-amber-400' : 'bg-emerald-500/10 text-emerald-400'}">${fEsc(f.status || 'unknown')}</span></td>
              <td class="text-right">
                ${isPending ? `<div class="flex items-center justify-end gap-1.5">
                  <button onclick="resolveAlert('${fEsc(aid)}', 'action_taken')" class="btn btn-danger text-[11px] py-1 px-2.5">Confirm</button>
                  <button onclick="resolveAlert('${fEsc(aid)}', 'dismissed')" class="btn btn-emerald text-[11px] py-1 px-2.5">Dismiss</button>
                </div>` : `<span class="text-xs text-[var(--a-text-muted)] font-bold">Resolved</span>`}
              </td>
            </tr>`;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-12 text-rose-400">' + fEsc(err.message || 'Error loading fraud alerts.') + '</td></tr>';
      }
    }

    async function resolveAlert(id, status) {
      const note = prompt('Resolution notes for audit log:', status === 'action_taken' ? 'Confirmed fraudulent shill bidding ring.' : 'Dismissed as false positive.');
      if (!note) return;
      try {
        await ApiClient.patch('/admin/fraud-alerts/' + encodeURIComponent(id) + '/resolve', { status, review_note: note });
        fToast(`Alert marked as ${status}.`, 'success');
        loadFraudAlerts();
      } catch (err) { fToast(err.message || 'Resolution failed.', 'error'); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const role = ApiClient.getUserRole && ApiClient.getUserRole();
      if (!ApiClient.isAuthenticated() || role !== 'admin') {
        window.location.href = '/login.html?redirect=/admin/fraud-alerts.html';
        return;
      }
      loadFraudAlerts();
    });
  </script>
  <script src="/assets/js/ai-chat.js" defer></script>
</body>

</html>
