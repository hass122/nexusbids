<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management — NexusBids Admin</title>
  <script>(function () { var t = localStorage.getItem('nexusbids_theme') || 'system'; var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.classList.toggle('dark', d); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); })();</script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } };</script>
  <script src="https://cdn.tailwindcss.com?plugins=forms" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <style>
    :root {
      --a-bg: #f4f6fb;
      --a-surface: #fff;
      --a-surface-2: #f7f9fc;
      --a-surface-3: #eceff6;
      --a-border: #e3e8f0;
      --a-text: #0f172a;
      --a-text-muted: #565650;
      --a-text-light: #6e6e68
    }

    html.dark {
      --a-bg: #05070f;
      --a-surface: #0d1220;
      --a-surface-2: #121a2b;
      --a-surface-3: #1a2336;
      --a-border: #1e2a40;
      --a-text: #eef2f9;
      --a-text-muted: #b8b8b0;
      --a-text-light: #8f8f88
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      background: var(--a-bg);
      color: var(--a-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    .panel {
      background: var(--a-surface);
      border: 1px solid var(--a-border);
      border-radius: 20px;
      overflow: hidden
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 11px;
      font-size: .78rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      font-family: inherit
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff
    }

    .btn-primary:hover {
      transform: translateY(-1px)
    }

    .btn-ghost {
      background: var(--a-surface-2);
      border-color: var(--a-border);
      color: var(--a-text)
    }

    .btn-ghost:hover {
      border-color: var(--a-border-strong, #cfd7e5);
      background: var(--a-surface-3)
    }

    .btn-danger {
      background: rgba(239, 68, 68, .12);
      border-color: rgba(239, 68, 68, .3);
      color: #f87171
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, .25)
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem
    }

    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--a-text-muted);
      border-bottom: 1px solid var(--a-border)
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--a-border);
      vertical-align: middle
    }

    .data-table tr:hover td {
      background: var(--a-surface-2)
    }

    .nb-input {
      background: var(--a-surface-2);
      border: 1px solid var(--a-border);
      color: var(--a-text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: .85rem;
      width: 100%;
      outline: none;
      font-family: inherit
    }

    .nb-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, .15)
    }
  </style>
</head>

<body class="min-h-screen flex flex-col font-sans">
  <header id="nb-header" style="min-height:64px;contain:layout"></header>
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div id="admin-subnav" style="min-height:52px;contain:layout"></div>

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold text-brand-400 bg-brand-500/10 border border-brand-500/20 mb-2">
          <i class="fa-solid fa-layer-group"></i> Catalog Taxonomy
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-[var(--a-text)]">Categories Management</h1>
        <p class="text-xs sm:text-sm text-[var(--a-text-muted)] mt-1">Configure item categories, visual styling and
          active taxonomies.</p>
      </div>
      <button onclick="openCategoryModal()" class="btn btn-primary text-xs">
        <i class="fa-solid fa-plus"></i> Add New Category
      </button>
    </div>

    <div class="panel">
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Description</th>
              <th>Accent Color</th>
              <th>Active Lots</th>
              <th>Status</th>
              <th class="text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="categories-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="category-modal"
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="panel max-w-md w-full bg-[var(--a-surface)] p-5 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-[var(--a-border)]">
        <h2 class="text-sm font-bold" id="modal-title">Add Category</h2>
        <button type="button" onclick="closeCategoryModal()"
          class="text-xs text-[var(--a-text-muted)] hover:text-[var(--a-text)]" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="category-form" onsubmit="saveCategory(event)" class="space-y-4">
        <input type="hidden" id="edit-category-id">
        <div>
          <label for="cat-name"
            class="text-[11px] font-bold uppercase tracking-wider text-[var(--a-text-muted)] block mb-1">Name *</label>
          <input type="text" id="cat-name" required class="nb-input" placeholder="e.g. Vintage Watches">
        </div>
        <div>
          <label for="cat-icon"
            class="text-[11px] font-bold uppercase tracking-wider text-[var(--a-text-muted)] block mb-1">FontAwesome
            Icon</label>
          <input type="text" id="cat-icon" class="nb-input" placeholder="e.g. fa-clock or fa-gem">
        </div>
        <div>
          <label for="cat-color"
            class="text-[11px] font-bold uppercase tracking-wider text-[var(--a-text-muted)] block mb-1">Accent
            Color</label>
          <input type="color" id="cat-color" value="#6366f1"
            class="w-full h-10 rounded-xl cursor-pointer bg-transparent border border-[var(--a-border)]">
        </div>
        <div>
          <label for="cat-desc"
            class="text-[11px] font-bold uppercase tracking-wider text-[var(--a-text-muted)] block mb-1">Description</label>
          <textarea id="cat-desc" rows="3" class="nb-input" placeholder="Short description…"></textarea>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2 border-t border-[var(--a-border)]">
          <button type="button" onclick="closeCategoryModal()" class="btn btn-ghost text-xs">Cancel</button>
          <button type="submit" id="btn-save-cat" class="btn btn-primary text-xs">Save</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="nb-footer"></footer>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin-nav.js" defer></script>
  <script>
    (function () {
      'use strict';
      let allCategories = [];

      function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      function safeColor(c) {
        // Only allow #RRGGBB or #RGB — prevents CSS injection
        return /^#[0-9A-Fa-f]{3,6}$/.test(String(c || '')) ? c : '#6366f1';
      }
      function safeIcon(icon) {
        // Only allow fa-* class names
        return /^fa-[a-z0-9-]+$/i.test(String(icon || '')) ? icon : 'fa-tag';
      }

      async function loadCategories() {
        const tbody = document.getElementById('categories-table-body');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-[var(--a-text-muted)]"><i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i><br>Loading…</td></tr>';
        try {
          const res = await ApiClient.get('/admin/categories');
          allCategories = (res && res.data) || (Array.isArray(res) ? res : []);

          if (!allCategories.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-[var(--a-text-muted)]">No categories found.</td></tr>';
            return;
          }

          tbody.innerHTML = allCategories.map(c => {
            const color = safeColor(c.color);
            const icon = safeIcon(c.icon);
            const status = (c.status || 'active').toLowerCase();
            const cid = esc(String(c.category_id));
            return `<tr>
              <td>
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-xl flex items-center justify-center text-sm"
                       style="background:${color}20;color:${color};border:1px solid ${color}40">
                    <i class="fa-solid ${icon}"></i>
                  </div>
                  <strong class="text-xs font-bold text-[var(--a-text)]">${esc(c.category_name)}</strong>
                </div>
              </td>
              <td><span class="text-xs text-[var(--a-text-muted)]" style="display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden">${esc(c.description || '—')}</span></td>
              <td>
                <span class="inline-flex items-center gap-1.5 font-mono text-xs text-[var(--a-text-muted)]">
                  <span class="w-3 h-3 rounded-full" style="background:${color}"></span>
                  ${esc(color)}
                </span>
              </td>
              <td><strong class="text-xs font-bold text-brand-400">${Number(c.auction_count || 0)} lots</strong></td>
              <td>
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase ${status === 'inactive' ? 'bg-rose-500/10 text-rose-400' : 'bg-emerald-500/10 text-emerald-400'}">${esc(status)}</span>
              </td>
              <td class="text-right">
                <div class="flex items-center justify-end gap-1.5">
                  <button type="button" onclick="editCategory('${cid}')" class="btn btn-ghost text-[11px] py-1 px-2.5" aria-label="Edit">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button type="button" onclick="deleteCategory('${cid}')" class="btn btn-danger text-[11px] py-1 px-2.5" aria-label="Delete">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </td>
            </tr>`;
          }).join('');
        } catch (err) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-rose-400">' + esc(err.message || 'Error loading categories.') + '</td></tr>';
        }
      }

      function openCategoryModal(cat = null) {
        document.getElementById('edit-category-id').value = cat ? String(cat.category_id) : '';
        document.getElementById('cat-name').value = cat ? cat.category_name : '';
        document.getElementById('cat-icon').value = cat ? (cat.icon || '') : '';
        document.getElementById('cat-color').value = cat ? safeColor(cat.color) : '#6366f1';
        document.getElementById('cat-desc').value = cat ? (cat.description || '') : '';
        document.getElementById('modal-title').textContent = cat ? 'Edit Category' : 'Add Category';
        document.getElementById('category-modal').classList.remove('hidden');
      }

      function closeCategoryModal() {
        document.getElementById('category-modal').classList.add('hidden');
      }

      // ✅ FIXED: string comparison for IDs
      function editCategory(id) {
        const cat = allCategories.find(c => String(c.category_id) === String(id));
        if (cat) openCategoryModal(cat);
      }

      async function saveCategory(e) {
        e.preventDefault();
        const id = document.getElementById('edit-category-id').value;
        const btn = document.getElementById('btn-save-cat');
        btn.disabled = true;

        const payload = {
          category_name: document.getElementById('cat-name').value.trim(),
          icon: safeIcon(document.getElementById('cat-icon').value.trim() || 'fa-tag'),
          color: safeColor(document.getElementById('cat-color').value),
          description: document.getElementById('cat-desc').value.trim()
        };

        try {
          if (id) {
            await ApiClient.put('/admin/categories/' + encodeURIComponent(id), payload);
            if (window.UI && UI.showToast) UI.showToast('Category updated', 'success');
          } else {
            await ApiClient.post('/admin/categories', payload);
            if (window.UI && UI.showToast) UI.showToast('Category created', 'success');
          }
          closeCategoryModal();
          loadCategories();
        } catch (err) {
          if (window.UI && UI.showToast) UI.showToast(err.message || 'Save failed', 'error');
        } finally { btn.disabled = false; }
      }

      async function deleteCategory(id) {
        if (!confirm('Delete this category? Listings under it will need reclassification.')) return;
        try {
          await ApiClient.delete('/admin/categories/' + encodeURIComponent(id));
          if (window.UI && UI.showToast) UI.showToast('Category deleted', 'success');
          loadCategories();
        } catch (err) {
          if (window.UI && UI.showToast) UI.showToast(err.message || 'Delete failed', 'error');
        }
      }

      window.openCategoryModal = openCategoryModal;
      window.closeCategoryModal = closeCategoryModal;
      window.editCategory = editCategory;
      window.saveCategory = saveCategory;
      window.deleteCategory = deleteCategory;

      document.addEventListener('DOMContentLoaded', () => {
        const role = ApiClient.getUserRole && ApiClient.getUserRole();
        if (!ApiClient.isAuthenticated() || role !== 'admin') {
          window.location.href = '/login.html?redirect=/admin/categories.html';
          return;
        }
        loadCategories();
      });
    })();
  </script>
  <script src="/assets/js/ai-chat.js" defer></script>
</body>

</html>
