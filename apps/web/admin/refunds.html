<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refunds Management — NexusBids Admin</title>
  <script>(function () { var t = localStorage.getItem('nexusbids_theme') || 'system'; var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.classList.toggle('dark', d); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); })();</script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } };</script>
  <script src="https://cdn.tailwindcss.com?plugins=forms" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <style>
    :root {
      --a-bg: #f4f6fb;
      --a-surface: #fff;
      --a-surface-2: #f7f9fc;
      --a-border: #e3e8f0;
      --a-text: #0f172a;
      --a-text-muted: #565650;
      --a-text-light: #6e6e68
    }

    html.dark {
      --a-bg: #05070f;
      --a-surface: #0d1220;
      --a-surface-2: #121a2b;
      --a-border: #1e2a40;
      --a-text: #eef2f9;
      --a-text-muted: #b8b8b0;
      --a-text-light: #8f8f88
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      background: var(--a-bg);
      color: var(--a-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    .panel {
      background: var(--a-surface);
      border: 1px solid var(--a-border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15)
    }

    .panel.p-0 {
      padding: 0
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 11px;
      font-size: .78rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      font-family: inherit
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem
    }

    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--a-text-muted);
      border-bottom: 1px solid var(--a-border)
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--a-border);
      vertical-align: middle
    }

    .data-table tr:hover td {
      background: var(--a-surface-2)
    }
  </style>
</head>

<body class="min-h-screen flex flex-col font-sans">
  <header id="nb-header" style="min-height:64px;contain:layout"></header>
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div id="admin-subnav" style="min-height:52px;contain:layout"></div>

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold text-brand-400 bg-brand-500/10 border border-brand-500/20 mb-2">
          <i class="fa-solid fa-rotate-left"></i> Payment Reversals
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-[var(--a-text)]">Refunds Administration</h1>
        <p class="text-xs sm:text-sm text-[var(--a-text-muted)] mt-1">Review refund claims, cancellations and returned
          escrow funds.</p>
      </div>
      <button onclick="loadRefunds()" class="btn btn-primary text-xs"><i class="fa-solid fa-rotate-right"></i>
        Refresh</button>
    </div>

    <div class="panel p-0 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order Ref</th>
              <th>Buyer</th>
              <th>Amount</th>
              <th>Reason</th>
              <th>Status</th>
              <th>Processed</th>
            </tr>
          </thead>
          <tbody id="refunds-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer id="nb-footer"></footer>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin-nav.js" defer></script>
  <script>
    function rEsc(s) {
      if (window.UI && UI.escapeHtml) return UI.escapeHtml(s);
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function rFormatPKR(v) {
      if (window.UI && UI.formatPKR) return UI.formatPKR(v);
      return 'PKR ' + Number(v || 0).toLocaleString('en-PK');
    }

    async function loadRefunds() {
      const tbody = document.getElementById('refunds-table-body');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-[var(--a-text-muted)]"><i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i><br>Loading refunds…</td></tr>';

      try {
        const res = await ApiClient.get('/admin/refunds');
        const refunds = (res && res.data) || [];

        if (!refunds.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-[var(--a-text-muted)]">No refund records.</td></tr>';
          return;
        }

        tbody.innerHTML = refunds.map(r => {
          const amount = parseFloat(r.amount || 0);
          const safeAmount = isFinite(amount) ? amount : 0;
          const processed = r.processed_at ? new Date(r.processed_at) : null;
          const processedStr = processed && !isNaN(processed.getTime()) ? processed.toLocaleDateString('en-PK') : 'Recently';
          const status = String(r.status || 'completed').toLowerCase();

          return `
            <tr>
              <td><span class="font-mono text-xs font-bold text-brand-400 block">${rEsc(r.order_number || ('#' + r.order_id))}</span><span class="text-[10px] text-[var(--a-text-muted)]">Order ID #${rEsc(r.order_id)}</span></td>
              <td><strong class="text-xs text-[var(--a-text)]">${rEsc(r.buyer_name || 'Buyer')}</strong></td>
              <td><strong class="text-xs font-black text-rose-400">${rFormatPKR(safeAmount)}</strong></td>
              <td><span class="text-xs text-[var(--a-text-muted)]">${rEsc(r.reason || 'Order dispute resolution')}</span></td>
              <td><span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase ${status === 'completed' || status === 'approved' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">${rEsc(r.status || 'completed')}</span></td>
              <td><span class="text-xs text-[var(--a-text-muted)]">${processedStr}</span></td>
            </tr>`;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-rose-400">' + rEsc(err.message || 'Error loading refunds.') + '</td></tr>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const role = ApiClient.getUserRole && ApiClient.getUserRole();
      if (!ApiClient.isAuthenticated() || role !== 'admin') {
        window.location.href = '/login.html?redirect=/admin/refunds.html';
        return;
      }
      loadRefunds();
    });
  </script>
  <script src="/assets/js/ai-chat.js" defer></script>
</body>

</html>
