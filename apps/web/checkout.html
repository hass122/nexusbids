<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Escrow Payment — NexusBids</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nexusbids_theme') || 'system';
        var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          colors: { brand: { 500: '#6366f1', 600: '#4f46e5' } }
        }
      }
    };
  </script>
  <style>
    html:not(.dark) body {
      background: var(--bg) !important;
    }

    html:not(.dark) .bg-slate-950 {
      background: var(--bg) !important;
    }

    html:not(.dark) .bg-slate-900 {
      background: var(--surface) !important;
    }

    html:not(.dark) .bg-slate-800 {
      background: var(--surface-3) !important;
    }

    html:not(.dark) .text-slate-100,
    html:not(.dark) .text-slate-200 {
      color: var(--text) !important;
    }

    html:not(.dark) .text-slate-300,
    html:not(.dark) .text-slate-400 {
      color: var(--text-muted) !important;
    }

    html:not(.dark) .text-slate-500 {
      color: var(--text-light) !important;
    }

    html:not(.dark) .border-slate-800,
    html:not(.dark) .border-slate-700 {
      border-color: var(--border) !important;
    }

    .dropzone {
      position: relative;
      border: 1.5px dashed rgb(51 65 85);
      border-radius: 1rem;
      padding: 1.75rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      background: rgb(2 6 23 / .4);
    }

    .dropzone:hover,
    .dropzone.is-dragover {
      border-color: #6366f1;
      background: rgb(99 102 241 / .06);
    }

    .dropzone input[type=file] {
      display: none;
    }

    html:not(.dark) .dropzone {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    html:not(.dark) .dropzone:hover,
    html:not(.dark) .dropzone.is-dragover {
      border-color: #6366f1;
      background: #eef2ff;
    }

    .receipt-thumb {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid rgb(51 65 85);
      background: rgb(2 6 23);
    }

    .receipt-thumb img {
      width: 100%;
      max-height: 16rem;
      object-fit: contain;
      display: block;
    }

    .receipt-thumb .thumb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .75rem 1rem;
      background: rgb(15 23 42);
      border-top: 1px solid rgb(51 65 85);
      font-size: .75rem;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: .5rem;
      color: rgb(148 163 184);
      transition: all .15s;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .copy-btn:hover {
      color: #fff;
      background: rgb(51 65 85);
    }

    .copy-btn.copied {
      color: #34d399;
    }

    .pay-method {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.125rem;
      border-radius: 1rem;
      border: 1.5px solid rgb(30 41 59);
      background: rgb(2 6 23 / .4);
      cursor: pointer;
      transition: all .18s;
      margin: 0;
    }

    .pay-method:hover {
      border-color: rgb(51 65 85);
    }

    .pay-method input[type=radio] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .pay-method .dot {
      width: 1.125rem;
      height: 1.125rem;
      border-radius: 9999px;
      border: 2px solid rgb(71 85 105);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all .18s;
    }

    .pay-method .dot::after {
      content: '';
      width: .5rem;
      height: .5rem;
      border-radius: 9999px;
      background: transparent;
      transition: all .18s;
    }

    .pay-method:has(input:checked) {
      border-color: #6366f1;
      background: rgb(99 102 241 / .08);
    }

    .pay-method:has(input:checked) .dot {
      border-color: #6366f1;
    }

    .pay-method:has(input:checked) .dot::after {
      background: #6366f1;
    }

    html:not(.dark) .pay-method {
      background: #fff;
      border-color: #e2e8f0;
    }

    html:not(.dark) .pay-method .dot {
      border-color: #cbd5e1;
    }

    .step-pill {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .35rem .75rem;
      border-radius: 9999px;
      font-size: .6875rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .hint-list {
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .hint-list li {
      display: flex;
      gap: .625rem;
      font-size: .75rem;
      line-height: 1.55;
      color: rgb(148 163 184);
    }

    .hint-list li .num {
      flex-shrink: 0;
      width: 1.125rem;
      height: 1.125rem;
      border-radius: 9999px;
      background: rgb(99 102 241 / .15);
      color: #a5b4fc;
      font-size: .625rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: .125rem;
    }

    html:not(.dark) .hint-list li {
      color: #64748b;
    }

    html:not(.dark) .hint-list li .num {
      background: #e0e7ff;
      color: #4f46e5;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-screen {
      animation: fadeUp .4s cubic-bezier(.2, .8, .2, 1) both;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <header id="nb-header"></header>

  <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12" id="checkout-root">
    <div class="py-24 text-center">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-brand-500"></i>
      <p class="mt-3 text-sm text-slate-500">Loading your order…</p>
    </div>
  </main>

  <footer id="nb-footer"></footer>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    // ─────────────────────────────────────────────────────────────
    // State
    // ─────────────────────────────────────────────────────────────
    let orderData = null;
    let receiptFile = null;
    let receiptDataUrl = null;

    const orderId = new URLSearchParams(location.search).get('order_id');

    // ─────────────────────────────────────────────────────────────
    // Helper
    // ─────────────────────────────────────────────────────────────
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ─────────────────────────────────────────────────────────────
    // ★★★ BOOT — bulletproof: fetch from list FIRST, then detail
    // ─────────────────────────────────────────────────────────────
    async function loadOrder() {
      if (!orderId) {
        location.replace('/buyer/orders.html');
        return;
      }

      // Step 1: Always try list first (works for every order status)
      let fromList = null;
      try {
        const listRes = await ApiClient.get('/orders/buyer');
        const list = (listRes && listRes.data) || [];
        fromList = list.find(o => String(o.order_id) === String(orderId)) || null;
      } catch (e) {
        console.warn('[Checkout] List fetch failed:', e);
      }

      // Step 2: Try detail endpoint (may 404 for paid orders — silently ignore)
      let detail = null;
      try {
        const res = await ApiClient.get(`/orders/${orderId}`);
        detail = res.data || null;
      } catch (e) {
        console.warn('[Checkout] Detail refused (OK if paid):', e?.message);
      }

      // Step 3: Prefer detail (fresher), fall back to list
      orderData = detail || fromList;

      if (!orderData) {
        renderError({ message: "We couldn't find this order in your account." });
        return;
      }

      // Step 4: Decide which screen
      const status = String(orderData.order_status || '').toLowerCase();
      const payment = String(orderData.payment_status || '').toLowerCase();
      const adminReview = String(orderData.admin_review_status || '').toLowerCase();
      const proofUploaded = !!(orderData.buyer_proof_uploaded_at);

      const alreadyPaid =
        payment === 'paid' ||
        payment === 'refunded' ||
        ['paid', 'shipped', 'in_transit', 'delivered', 'completed', 'cancelled', 'canceled'].includes(status);

      if (alreadyPaid) { showAlreadyPaid(); return; }
      if (adminReview === 'rejected') { showRejected(); return; }
      if (proofUploaded && (adminReview === 'pending' || adminReview === 'in_review' || adminReview === '')) {
        showVerifying();
        return;
      }

      renderCheckout();
    }

    // ─────────────────────────────────────────────────────────────
    // Error screen
    // ─────────────────────────────────────────────────────────────
    function renderError(err) {
      document.getElementById('checkout-root').innerHTML = `
        <div class="max-w-md mx-auto text-center py-16 px-4 rounded-2xl bg-slate-900 border border-slate-800 status-screen">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-500/10 border border-rose-500/25 flex items-center justify-center">
            <i class="fa-solid fa-triangle-exclamation text-rose-400 text-xl"></i>
          </div>
          <h2 class="mt-5 text-lg font-bold text-white">We couldn't load this order</h2>
          <p class="mt-2 text-sm text-slate-400 leading-relaxed">
            ${escapeHtml(err?.message || 'It may have been removed, or you may not have access to it.')}
          </p>
          <a href="/buyer/orders.html"
             class="inline-flex items-center gap-2 mt-6 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold transition">
            <i class="fa-solid fa-arrow-left text-xs"></i> Back to my orders
          </a>
        </div>
      `;
    }

    // ─────────────────────────────────────────────────────────────
    // Already paid / completed
    // ─────────────────────────────────────────────────────────────
    function showAlreadyPaid() {
      const o = orderData;
      const amount = UI.formatPKR(o.total_amount);
      const status = String(o.order_status || '').toLowerCase();

      const isCompleted = status === 'completed' || status === 'delivered';
      const isCancelled = status === 'cancelled' || status === 'canceled';

      let title, message, iconHtml, iconBg;

      if (isCancelled) {
        title = 'This order was cancelled';
        message = "This order is no longer active. If you believe this is a mistake, please contact support.";
        iconHtml = '<i class="fa-solid fa-ban text-rose-400 text-2xl"></i>';
        iconBg = 'bg-rose-500/10 border-rose-500/30';
      } else if (isCompleted) {
        title = 'This order is complete';
        message = "You've already paid for this order and it has been delivered. Nothing else to do here.";
        iconHtml = '<i class="fa-solid fa-circle-check text-emerald-400 text-2xl"></i>';
        iconBg = 'bg-emerald-500/10 border-emerald-500/30';
      } else {
        title = 'Payment already received';
        message = "We've already received your payment for this order. You don't need to pay again.";
        iconHtml = '<i class="fa-solid fa-circle-check text-emerald-400 text-2xl"></i>';
        iconBg = 'bg-emerald-500/10 border-emerald-500/30';
      }

      document.getElementById('checkout-root').innerHTML = `
        <div class="max-w-lg mx-auto text-center py-14 px-6 rounded-2xl bg-slate-900 border border-slate-800 status-screen">
          <div class="w-16 h-16 mx-auto rounded-2xl ${iconBg} border flex items-center justify-center">
            ${iconHtml}
          </div>
          <h2 class="mt-6 text-xl font-bold text-white">${title}</h2>
          <p class="mt-3 text-sm text-slate-400 leading-relaxed">${message}</p>
          <p class="mt-4 text-xs text-slate-500">
            Order <strong class="text-slate-300">#${escapeHtml(o.order_number || '')}</strong>
            · ${escapeHtml(amount)}
          </p>
          <div class="mt-7 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/buyer/orders.html"
               class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold transition">
              <i class="fa-solid fa-box text-xs"></i> Track my order
            </a>
            <a href="/auctions.html"
               class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition">
              Browse auctions
            </a>
          </div>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ─────────────────────────────────────────────────────────────
    // Receipt submitted, admin reviewing
    // ─────────────────────────────────────────────────────────────
    function showVerifying() {
      const o = orderData;
      const amount = UI.formatPKR(o.total_amount);

      document.getElementById('checkout-root').innerHTML = `
        <div class="max-w-lg mx-auto text-center py-14 px-6 rounded-2xl bg-slate-900 border border-slate-800 status-screen">
          <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center">
            <i class="fa-solid fa-clock-rotate-left text-blue-400 text-2xl"></i>
          </div>
          <h2 class="mt-6 text-xl font-bold text-white">Payment under review</h2>
          <p class="mt-3 text-sm text-slate-400 leading-relaxed">
            We already have your payment proof for this order. Our team will verify it shortly —
            you don't need to upload it again.
          </p>
          <p class="mt-4 text-xs text-slate-500">
            Order <strong class="text-slate-300">#${escapeHtml(o.order_number || '')}</strong>
            · ${escapeHtml(amount)}
          </p>
          <div class="mt-7 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/buyer/orders.html"
               class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition">
              <i class="fa-solid fa-arrow-left text-xs"></i> Back to orders
            </a>
          </div>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ─────────────────────────────────────────────────────────────
    // Admin rejected — allow re-upload
    // ─────────────────────────────────────────────────────────────
    function showRejected() {
      const o = orderData;
      const amount = UI.formatPKR(o.total_amount);
      const reason = o.admin_review_notes || '';

      document.getElementById('checkout-root').innerHTML = `
        <div class="max-w-lg mx-auto py-10 px-6 rounded-2xl bg-slate-900 border border-rose-500/30 status-screen">
          <div class="text-center">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center">
              <i class="fa-solid fa-circle-exclamation text-rose-400 text-2xl"></i>
            </div>
            <h2 class="mt-6 text-xl font-bold text-white">Payment couldn't be verified</h2>
            <p class="mt-3 text-sm text-slate-400 leading-relaxed">
              Our team reviewed your payment proof and couldn't confirm it. Please double-check the
              details and upload a clearer screenshot.
            </p>
            ${reason ? `
              <div class="mt-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-left">
                <p class="text-[11px] font-bold uppercase tracking-wider text-rose-400 mb-1">Reason from reviewer</p>
                <p class="text-xs text-rose-200 leading-relaxed">${escapeHtml(reason)}</p>
              </div>
            ` : ''}
            <p class="mt-4 text-xs text-slate-500">
              Order <strong class="text-slate-300">#${escapeHtml(o.order_number || '')}</strong>
              · ${escapeHtml(amount)}
            </p>
          </div>
          <div class="mt-7 flex flex-col sm:flex-row gap-3 justify-center">
            <button type="button" onclick="renderCheckout()"
                    class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold transition">
              <i class="fa-solid fa-cloud-arrow-up text-xs"></i> Upload new proof
            </button>
            <a href="/support.html"
               class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition">
              <i class="fa-solid fa-headset text-xs"></i> Contact support
            </a>
          </div>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ─────────────────────────────────────────────────────────────
    // Normal checkout form
    // ─────────────────────────────────────────────────────────────
    function renderCheckout() {
      const o = orderData;
      const amount = UI.formatPKR(o.total_amount);
      const cover = o.auction_image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&auto=format&fit=crop&q=70';

      const rejectedNotice = String(o.admin_review_status || '').toLowerCase() === 'rejected'
        ? `<div class="mb-5 p-3 rounded-xl bg-rose-500/10 border border-rose-500/25 flex items-start gap-3">
             <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm mt-0.5"></i>
             <div>
               <p class="text-xs font-bold text-rose-300">Previous proof was rejected</p>
               <p class="text-[11px] text-rose-200/80 leading-relaxed mt-0.5">
                 Please upload a clearer screenshot this time — make sure the amount and transaction ID are readable.
               </p>
             </div>
           </div>`
        : '';

      document.getElementById('checkout-root').innerHTML = `
        <div class="mb-8">
          <a href="/buyer/orders.html"

            <i class="fa-solid fa-arrow-left text-[10px]"></i> My orders
          </a>

          <div class="flex flex-wrap items-center gap-2 mb-3">
            <span class="step-pill bg-emerald-500/10 text-emerald-400 border border-emerald-500/25">
              <i class="fa-solid fa-lock text-[10px]"></i> Escrow protected
            </span>
            <span class="step-pill bg-slate-800/60 text-slate-400 border border-slate-700/60">
              Order #${escapeHtml(o.order_number || '—')}
            </span>
          </div>

          <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
            Confirm your deposit
          </h1>
          <p class="mt-2 text-sm text-slate-400 leading-relaxed max-w-xl">
            Transfer <span class="font-bold text-emerald-400">${amount}</span> to the account below, then upload a screenshot of the receipt. Your payment stays in escrow until you confirm the item has arrived.
          </p>
        </div>

        ${rejectedNotice}

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
          <div class="lg:col-span-7 space-y-6">

            <section class="p-5 sm:p-6 rounded-2xl bg-slate-900 border border-slate-800">
              <div class="flex items-center gap-3 mb-4">
                <span class="w-6 h-6 rounded-full bg-brand-600/15 text-brand-500 text-xs font-bold flex items-center justify-center">1</span>
                <h2 class="text-sm font-bold text-white">Choose how you want to pay</h2>
              </div>

              <div class="space-y-2.5">
                <label class="pay-method">
                  <input type="radio" name="payment_type" value="jazzcash" checked>
                  <span class="dot"></span>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                      <p class="text-sm font-bold text-white">JazzCash</p>
                      <div class="flex items-center gap-1">
                        <span class="text-xs font-mono font-bold text-rose-300 select-all">0323-1328558</span>
                        <button type="button" class="copy-btn" data-copy="03231328558" aria-label="Copy">
                          <i class="fa-regular fa-copy text-[11px]"></i>
                        </button>
                      </div>
                    </div>
                    <p class="text-[11px] text-slate-500 mt-0.5">Account title: NexusBids Pvt Ltd</p>
                  </div>
                </label>

                <label class="pay-method">
                  <input type="radio" name="payment_type" value="easypaisa">
                  <span class="dot"></span>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                      <p class="text-sm font-bold text-white">Easypaisa</p>
                      <div class="flex items-center gap-1">
                        <span class="text-xs font-mono font-bold text-emerald-300 select-all">0345-9876543</span>
                        <button type="button" class="copy-btn" data-copy="0345-9876543" aria-label="Copy">
                          <i class="fa-regular fa-copy text-[11px]"></i>
                        </button>
                      </div>
                    </div>
                    <p class="text-[11px] text-slate-500 mt-0.5">Account title: NexusBids Pvt Ltd</p>
                  </div>
                </label>

                <label class="pay-method">
                  <input type="radio" name="payment_type" value="bank_transfer">
                  <span class="dot"></span>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                      <p class="text-sm font-bold text-white">Meezan Bank — IBFT</p>
                      <div class="flex items-center gap-1">
                        <span class="text-xs font-mono font-bold text-indigo-300 select-all">0102 0304 0506 07</span>
                        <button type="button" class="copy-btn" data-copy="01020304050607" aria-label="Copy">
                          <i class="fa-regular fa-copy text-[11px]"></i>
                        </button>
                      </div>
                    </div>
                    <p class="text-[11px] text-slate-500 mt-0.5">Meezan Bank • NexusBids Pvt Ltd • Karachi Main Branch</p>
                  </div>
                </label>
              </div>

              <ul class="hint-list mt-5 pt-4 border-t border-slate-800">
                <li><span class="num">1</span> Open your wallet or banking app and send <strong class="text-slate-200">${amount}</strong> exactly.</li>
                <li><span class="num">2</span> Take a screenshot of the success screen — it must show the amount, date, and transaction ID.</li>
                <li><span class="num">3</span> Upload that screenshot below. We'll verify it within a few minutes.</li>
              </ul>
            </section>

            <section class="p-5 sm:p-6 rounded-2xl bg-slate-900 border border-slate-800">
              <div class="flex items-center gap-3 mb-4">
                <span class="w-6 h-6 rounded-full bg-brand-600/15 text-brand-500 text-xs font-bold flex items-center justify-center">2</span>
                <h2 class="text-sm font-bold text-white">Upload your payment proof</h2>
              </div>

              <div class="space-y-4">
                <div>
                  <label for="tx_id" class="block text-xs font-semibold text-slate-300 mb-1.5">
                    Transaction ID <span class="text-rose-400">*</span>
                  </label>
                  <input type="text" id="tx_id" required autocomplete="off"

                         class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition">
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">
                    Receipt screenshot <span class="text-rose-400">*</span>
                  </label>

                  <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Upload receipt image">
                    <input type="file" id="receipt_file" accept="image/png,image/jpeg,image/jpg,image/webp,image/heic" capture="environment">
                    <div class="pointer-events-none">
                      <div class="w-11 h-11 mx-auto rounded-xl bg-brand-500/10 border border-brand-500/25 flex items-center justify-center mb-3">
                        <i class="fa-solid fa-cloud-arrow-up text-brand-500 text-lg"></i>
                      </div>
                      <p class="text-sm font-semibold text-white">
                        Tap to upload <span class="text-slate-400 font-normal">or drag the image here</span>
                      </p>
                      <p class="text-[11px] text-slate-500 mt-1.5">PNG, JPG or WEBP · up to 5 MB</p>
                    </div>
                  </div>

                  <div id="receipt_preview" class="hidden"></div>
                  <p id="receipt_error" class="hidden text-[11px] text-rose-400 mt-1.5"></p>
                </div>

                <button type="button" onclick="submitReceipt()" id="btn-pay"
                        class="w-full inline-flex items-center justify-center gap-2 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-[.99] disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold text-sm shadow-lg shadow-emerald-600/25 transition-all">
                  <i class="fa-solid fa-shield-halved"></i>
                  <span>Submit deposit for verification</span>
                </button>

                <p class="text-[11px] text-slate-500 text-center leading-relaxed">
                  By submitting, you confirm the transfer was made from your own account.
                </p>
              </div>
            </section>
          </div>

          <aside class="lg:col-span-5">
            <div class="lg:sticky lg:top-24 space-y-4">
              <div class="p-5 sm:p-6 rounded-2xl bg-slate-900 border border-slate-800">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Order summary</h3>

                <div class="flex items-start gap-3.5 pb-4 border-b border-slate-800">
                  <img src="${escapeHtml(cover)}" alt="" width="64" height="64"
                       class="w-16 h-16 rounded-xl object-cover bg-slate-800 shrink-0"
                       onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&auto=format&fit=crop&q=70'">
                  <div class="min-w-0">
                    <h4 class="font-bold text-white text-sm leading-snug line-clamp-2">
                      ${escapeHtml(o.auction_title || 'Auction item')}
                    </h4>
                    <p class="text-[11px] text-slate-500 mt-1">Order #${escapeHtml(o.order_number || '—')}</p>
                  </div>
                </div>

                <dl class="py-4 space-y-2.5 border-b border-slate-800 text-xs">
                  <div class="flex justify-between">
                    <dt class="text-slate-400">Winning bid</dt>
                    <dd class="font-semibold text-slate-200 tabular-nums">${UI.formatPKR(o.total_amount)}</dd>
                  </div>
                  <div class="flex justify-between">
                    <dt class="text-slate-400">Escrow fee</dt>
                    <dd class="font-semibold text-emerald-400">Free</dd>
                  </div>
                  <div class="flex justify-between">
                    <dt class="text-slate-400">Delivery</dt>
                    <dd class="font-semibold text-slate-200">Included</dd>
                  </div>
                </dl>

                <div class="pt-4 flex items-baseline justify-between">
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Total to send</span>
                  <span class="text-2xl font-black text-emerald-400 tabular-nums">${amount}</span>
                </div>
              </div>

              <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-3">
                <div class="flex items-start gap-3">
                  <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/25 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-vault text-emerald-400 text-xs"></i>
                  </div>
                  <div>
                    <p class="text-xs font-bold text-white">Money stays with us</p>
                    <p class="text-[11px] text-slate-400 mt-0.5 leading-relaxed">
                      We release funds to the seller only after you confirm the item is as described.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </div>
      `;

      wireUpDropzone();
      wireUpCopyButtons();
    }

    // ─────────────────────────────────────────────────────────────
    // File upload
    // ─────────────────────────────────────────────────────────────
    const MAX_BYTES = 5 * 1024 * 1024;
    const ALLOWED = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp', 'image/heic', 'image/heif'];

    function wireUpDropzone() {
      const zone = document.getElementById('dropzone');
      const input = document.getElementById('receipt_file');
      if (!zone || !input) return;

      zone.addEventListener('click', () => input.click());
      zone.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
      });

      ['dragenter', 'dragover'].forEach(evt =>
        zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.add('is-dragover'); })
      );
      ['dragleave', 'drop'].forEach(evt =>
        zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.remove('is-dragover'); })
      );
      zone.addEventListener('drop', e => {
        const f = e.dataTransfer?.files?.[0];
        if (f) handleFile(f);
      });

      input.addEventListener('change', e => {
        const f = e.target.files?.[0];
        if (f) handleFile(f);
      });
    }

    function handleFile(file) {
      const errEl = document.getElementById('receipt_error');
      const fail = (msg) => {
        if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
        UI.showToast(msg, 'error');
      };

      if (!ALLOWED.includes(file.type) && !file.type.startsWith('image/')) {
        return fail('That file type is not supported. Please upload a PNG or JPG.');
      }
      if (file.size > MAX_BYTES) {
        return fail(`Image is ${(file.size / 1024 / 1024).toFixed(1)} MB — the limit is 5 MB. Try compressing it first.`);
      }

      if (errEl) errEl.classList.add('hidden');

      const reader = new FileReader();
      reader.onload = (e) => {
        receiptFile = file;
        receiptDataUrl = e.target.result;
        showPreview(file, receiptDataUrl);
      };
      reader.onerror = () => fail('We could not read that file. Please try again.');
      reader.readAsDataURL(file);
    }

    function showPreview(file, dataUrl) {
      const zone = document.getElementById('dropzone');
      const preview = document.getElementById('receipt_preview');
      if (!zone || !preview) return;

      zone.style.display = 'none';
      preview.classList.remove('hidden');

      const kb = file.size < 1024 * 1024
        ? `${Math.round(file.size / 1024)} KB`
        : `${(file.size / 1024 / 1024).toFixed(1)} MB`;

      preview.innerHTML = `
        <div class="receipt-thumb">
          <img src="${dataUrl}" alt="Receipt preview">
          <div class="thumb-bar">
            <div class="min-w-0">
              <p class="font-semibold text-slate-200 truncate">${escapeHtml(file.name)}</p>
              <p class="text-slate-500 text-[11px] mt-0.5">${kb}</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button type="button" onclick="reopenPicker()"
                      class="text-[11px] font-semibold text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg hover:bg-slate-800 transition">
                Replace
              </button>
              <button type="button" onclick="clearReceipt()"
                      class="text-[11px] font-semibold text-rose-400 hover:text-rose-300 px-2.5 py-1.5 rounded-lg hover:bg-rose-500/10 transition">
                Remove
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function reopenPicker() {
      document.getElementById('receipt_file')?.click();
    }

    function clearReceipt() {
      receiptFile = null;
      receiptDataUrl = null;
      const zone = document.getElementById('dropzone');
      const preview = document.getElementById('receipt_preview');
      const input = document.getElementById('receipt_file');
      if (input) input.value = '';
      if (preview) { preview.classList.add('hidden'); preview.innerHTML = ''; }
      if (zone) zone.style.display = '';
    }

    // ─────────────────────────────────────────────────────────────
    // Copy buttons
    // ─────────────────────────────────────────────────────────────
    function wireUpCopyButtons() {
      document.querySelectorAll('.copy-btn[data-copy]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const text = btn.dataset.copy;
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch { }
            ta.remove();
          }
          const icon = btn.querySelector('i');
          if (icon) {
            const original = icon.className;
            icon.className = 'fa-solid fa-check text-[11px]';
            btn.classList.add('copied');
            setTimeout(() => {
              icon.className = original;
              btn.classList.remove('copied');
            }, 1400);
          }
        });
      });
    }

    // ─────────────────────────────────────────────────────────────
    // Submit receipt
    // ─────────────────────────────────────────────────────────────
    async function submitReceipt() {
      const txId = document.getElementById('tx_id')?.value.trim() || '';
      const errEl = document.getElementById('receipt_error');
      const btn = document.getElementById('btn-pay');

      if (!txId) {
        document.getElementById('tx_id')?.focus();
        UI.showToast('Please enter the transaction ID from your payment SMS.', 'warning');
        return;
      }
      if (txId.length < 6) {
        UI.showToast('That transaction ID looks too short. Please double-check it.', 'warning');
        return;
      }
      if (!receiptFile || !receiptDataUrl) {
        if (errEl) { errEl.textContent = 'Please upload a screenshot of the payment receipt.'; errEl.classList.remove('hidden'); }
        document.getElementById('dropzone')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        UI.showToast('Upload the receipt screenshot to continue.', 'warning');
        return;
      }

      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Submitting…</span>';

      try {
        const paymentType = document.querySelector('input[name="payment_type"]:checked')?.value || 'jazzcash';
        let receiptPath = receiptDataUrl;

        try {
          const form = new FormData();
          form.append('file', receiptFile);
          const up = await ApiClient.upload?.('/uploads/receipt', form);
          if (up?.data?.url) receiptPath = up.data.url;
        } catch { }

        await ApiClient.post(`/payments/order/${orderId}/confirm-receipt`, {
          receipt_path: receiptPath,
          transaction_id: txId,
          payment_method: paymentType,
        });

        document.getElementById('checkout-root').innerHTML = `
          <div class="max-w-lg mx-auto text-center py-16 px-6 rounded-2xl bg-slate-900 border border-slate-800 status-screen">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center">
              <i class="fa-solid fa-check text-emerald-400 text-2xl"></i>
            </div>
            <h2 class="mt-6 text-xl font-bold text-white">Receipt submitted</h2>
            <p class="mt-3 text-sm text-slate-400 leading-relaxed">
              We've received your proof of payment. Verification usually takes a few minutes during business hours.
            </p>
            <div class="mt-7 flex flex-col sm:flex-row gap-3 justify-center">
              <a href="/buyer/orders.html"
                 class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold transition">
                <i class="fa-solid fa-box text-xs"></i> Track my order
              </a>
              <a href="/auctions.html"
                 class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition">
                Back to auctions
              </a>
            </div>
          </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });

      } catch (err) {
        if (err?.message && err.message.toLowerCase().includes('already under review')) {
          UI.showToast('Your receipt has already been submitted and is currently under review.', 'info');
          showVerifying();
          return;
        }
        UI.showToast(err?.message || 'Could not submit the receipt. Please try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }

    // Expose to inline handlers
    window.renderCheckout = renderCheckout;
    window.reopenPicker = reopenPicker;
    window.clearReceipt = clearReceipt;
    window.submitReceipt = submitReceipt;

    document.addEventListener('DOMContentLoaded', loadOrder);
  </script>
  <script src="/assets/js/ai-chat.js"></script>
</body>
