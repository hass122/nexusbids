<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — NexusBids</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-900 to-indigo-900 p-4">
  <div class="max-w-md w-full bg-white/5 border border-indigo-500/30 rounded-2xl p-8 text-center">
    <div id="status-icon" class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-indigo-500/20 flex items-center justify-center text-2xl">⏳</div>
    <h1 id="title" class="text-2xl font-bold text-white mb-2">Verifying Email...</h1>
    <p id="message" class="text-sm text-gray-400">Please wait.</p>
    <a href="/login.html" id="login-btn" class="hidden mt-6 inline-block px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-semibold">Go to Login</a>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    (async () => {
      if (!token) {
        document.getElementById('title').textContent = 'Invalid Link';
        document.getElementById('message').textContent = 'No verification token.';
        return;
      }
      try {
        const res = await fetch(`/api/v1/auth/verify-email?token=${token}`);
        if (res.ok) {
          document.getElementById('status-icon').textContent = '✅';
          document.getElementById('title').textContent = 'Email Verified!';
          document.getElementById('message').textContent = 'You can now log in.';
          document.getElementById('login-btn').classList.remove('hidden');
        } else {
          document.getElementById('status-icon').textContent = '❌';
          document.getElementById('title').textContent = 'Verification Failed';
          document.getElementById('message').textContent = 'Link may be expired.';
        }
      } catch { document.getElementById('message').textContent = 'Network error.'; }
    })();
  </script>
</body>
</html>
